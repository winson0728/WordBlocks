<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>字根工坊</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: desktop = labelled nav rail + workspace (explore is list | radial map | detail); tablet = icon rail; phone = single column of cards + bottom tab bar */
:root{
  --bg:#edf1f0; --surface:#ffffff; --sunk:#e2e8e6; --ink:#17201e; --muted:#566562; --line:#d2dbd8;
  --accent:#0d6a61; --accent-ink:#ffffff;
  --pre:#2a68c9; --root:#bf5a14; --suf:#7647c9; --link:#7d8b88;
  --good:#2b8548; --bad:#c03636; --gold:#b07a12; --silver:#7b8a93; --bronze:#a2603a;
  --display:"LXGW WenKai TC","Noto Serif TC","Songti TC",serif;
  --latin:"Bitter",Georgia,"Times New Roman",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1514; --surface:#171f1e; --sunk:#0b100f; --ink:#e3eae8; --muted:#94a4a0; --line:#28332f;
    --accent:#3db3a4; --accent-ink:#04201c;
    --pre:#7ba9f6; --root:#f29a56; --suf:#b597f6; --link:#7f8e8a;
    --good:#5cc47f; --bad:#f07171; --gold:#e2b44c; --silver:#a9b6bd; --bronze:#d08a5f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#171f1e; --sunk:#0b100f; --ink:#e3eae8; --muted:#94a4a0; --line:#28332f;
  --accent:#3db3a4; --accent-ink:#04201c;
  --pre:#7ba9f6; --root:#f29a56; --suf:#b597f6; --link:#7f8e8a;
  --good:#5cc47f; --bad:#f07171; --gold:#e2b44c; --silver:#a9b6bd; --bronze:#d08a5f;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.latin{font-family:var(--latin)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;display:flex;flex-direction:column;gap:6px;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:22px;font-weight:700;position:relative}
.logo::before{content:"";position:absolute;top:-5px;left:7px;right:7px;height:5px;background:radial-gradient(circle at 50% 100%,var(--accent) 0 4px,transparent 4.5px) 0 0/12px 5px repeat-x}
.bname{font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a[aria-current="page"]{background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent)}
.rail .widget{margin-top:auto}
.main{min-width:0;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.main>*{max-width:1320px;margin-inline:auto}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:20px}
.top h1{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:.02em}
.top p{color:var(--muted);margin-top:2px}
.top-r{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.legend{display:flex;gap:12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 6px 5px 12px;border-radius:999px;background:color-mix(in srgb,var(--gold) 15%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);color:var(--ink)}
.pill button{border:0;background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--ink)}
.acct{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink)}
.acct i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.acct[data-s="synced"] i{background:var(--good)} .acct[data-s="syncing"] i{background:var(--gold)} .acct[data-s="error"] i{background:var(--bad)}
.acct-wrap{position:relative}
.lvl{display:inline-grid;grid-auto-flow:column;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.lvl button{border:0;background:transparent;border-radius:999px;padding:3px 11px;font-size:12.5px;color:var(--muted)}
.lvl button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.lvchip{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:5px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.acct-panel{position:absolute;right:0;top:calc(100% + 8px);z-index:30;width:min(320px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:16px;display:grid;gap:10px}
.acct-panel h3{font-family:var(--display);font-size:18px}
.acct-panel .row{display:flex;gap:8px}
.acct-panel .row .btn{flex:1}
.acct-msg{font-size:13px;color:var(--bad)}
.acct-msg.ok{color:var(--good)}
.view[hidden]{display:none}

/* ---------- generic ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h2{font-family:var(--display);font-size:20px;font-weight:700;margin-bottom:4px}
.sub{color:var(--muted);font-size:13.5px}
.k{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 10px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-family:var(--latin);font-size:14px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
input[type="text"],input[type="search"]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 12px;min-width:0}
input[type="text"]:focus,input[type="search"]:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface)}

/* ---------- lego blocks ---------- */
.lego{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding-top:8px;transition:gap .5s cubic-bezier(.2,.8,.2,1)}
.lego.joined{gap:0}
.lego.joined .blk{transform:translateY(4px)}
.blk{--c:var(--root);position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:62px;padding:10px 14px 9px;border:2px solid var(--c);border-radius:6px;background:color-mix(in srgb,var(--c) 12%,var(--surface));text-align:center;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.blk::before{content:"";position:absolute;top:-8px;left:10px;right:10px;height:6px;background:radial-gradient(circle at 50% 100%,var(--c) 0 5px,transparent 5.5px) 50% 0/20px 6px repeat-x}
button.blk:hover{transform:translateY(-3px);box-shadow:0 6px 0 -2px color-mix(in srgb,var(--c) 35%,transparent)}
.blk .bk{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--c);font-weight:600}
.blk .bt{font-family:var(--latin);font-weight:700;font-size:26px;line-height:1.15;color:var(--c)}
.blk .bm{font-size:12.5px;color:var(--ink)}
.blk.mini{min-width:0;padding:6px 9px 5px}
.blk.mini .bt{font-size:17px}
.blk.mini .bk{display:none}
.blk.mini::before{top:-6px;height:5px;background-size:14px 5px;background-image:radial-gradient(circle at 50% 100%,var(--c) 0 3.5px,transparent 4px)}
.t-pre{color:var(--pre);fill:var(--pre)} .t-root{color:var(--root);fill:var(--root)} .t-suf{color:var(--suf);fill:var(--suf)} .t-link{color:var(--link);fill:var(--link)}

/* ---------- explore ---------- */
.ex-grid{display:grid;grid-template-columns:240px minmax(0,1fr) 350px;gap:16px;align-items:start}
.ex-list{position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;gap:12px;padding:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:9px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 0;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.mlist{overflow-y:auto;display:flex;flex-direction:column;gap:14px;margin-inline:-6px;padding-inline:6px}
.lg-h{font-size:12px;color:var(--muted);margin-bottom:4px;letter-spacing:.04em}
.lg-items{display:flex;flex-direction:column;gap:2px}
.li{--c:var(--root);display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:8px;width:100%;border:0;background:transparent;text-align:left;border-radius:8px;padding:6px 8px}
.li:hover{background:var(--sunk)}
.li.on{background:color-mix(in srgb,var(--c) 13%,var(--surface))}
.li-f{font-family:var(--latin);font-weight:700;color:var(--c);white-space:nowrap}
.li-m{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.li .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-left:4px;vertical-align:middle}
.empty{color:var(--muted);font-size:13.5px;padding:8px}
.mapwrap{padding:10px;position:relative}
.maphead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 8px 0}
.map{display:block;width:100%;height:auto;max-width:100%}
.map .ln{stroke:var(--line);stroke-width:1.5}
.map .ctr circle{fill:color-mix(in srgb,var(--cc) 14%,var(--surface));stroke:var(--cc);stroke-width:2.5}
.map .ctr{cursor:pointer}
.map .cf{font-family:var(--latin);font-weight:700;font-size:25px;fill:var(--cc);text-anchor:middle}
.map .cm{font-family:var(--body);font-size:13px;fill:var(--ink);text-anchor:middle}
.map .ck{font-family:var(--mono);font-size:10px;fill:var(--muted);text-anchor:middle;letter-spacing:.1em}
.map .nd{cursor:pointer;transform:translate(var(--x),var(--y));transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .4s}
.map.boot .nd{transform:translate(320px,220px);opacity:0}
.map .nd rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.map .nd:hover rect{stroke:var(--muted)}
.map .nd.sel rect{stroke:var(--accent);stroke-width:2.5;fill:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.map .nd:focus{outline:none}
.map .nd:focus-visible rect{stroke:var(--accent);stroke-width:3}
.map .nw{font-family:var(--latin);font-weight:600;font-size:16px;text-anchor:middle}
.map .nw .hit{font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.map .nz{font-family:var(--body);font-size:11.5px;fill:var(--muted);text-anchor:middle}
.map .more{font-size:12px;fill:var(--muted);text-anchor:middle}
.detail{display:flex;flex-direction:column;gap:16px}
.wc-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wc-w{font-family:var(--latin);font-weight:700;font-size:30px;line-height:1.2;overflow-wrap:anywhere}
.lit{margin-top:14px;font-size:14.5px}
.lit b{font-weight:700}
.ex{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--sunk);font-family:var(--latin);font-size:14.5px;line-height:1.5}
.ex mark{background:transparent;color:var(--accent);font-weight:700}
.mc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tchip{--c:var(--root);font-size:12px;font-weight:700;padding:2px 9px;border-radius:5px;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--c)}
.mc-f{font-family:var(--latin);font-weight:700;font-size:28px;color:var(--c);line-height:1.25;margin-top:6px;overflow-wrap:anywhere}
.mc-m{font-size:17px;font-weight:500}
.mc-o{font-size:13px;color:var(--muted);margin-top:2px}
.story{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-family:var(--display);font-size:16px;line-height:1.75}
.scene{margin-top:12px;display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:10px;border:1.5px dashed var(--line);border-radius:10px;font-size:13.5px}
.scene svg{width:52px;height:52px}
.wl{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px}
.widget-inline{display:none;margin-bottom:16px}

/* widget */
.wg{--c:var(--root);position:relative;border-radius:16px;padding:14px 16px;background:color-mix(in srgb,var(--c) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,transparent);display:grid;gap:2px}
.wg-k{font-size:11.5px;color:var(--muted)}
.wg-f{font-family:var(--latin);font-weight:700;font-size:28px;color:var(--c);line-height:1.2}
.wg-m{font-family:var(--display);font-size:17px}
.wg-w{font-family:var(--latin);font-size:13px;color:var(--muted)}
.wg button{justify-self:start;margin-top:6px}

/* ---------- split ---------- */
.sp-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.sp-form{display:flex;gap:8px;margin-top:14px}
.sp-form input{font-family:var(--latin);font-size:17px}
.sp-ex{margin-top:12px}
.sp-out{margin-top:22px;min-height:180px}
.so-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px}
.so-w{font-family:var(--latin);font-weight:700;font-size:34px;overflow-wrap:anywhere}
.src{font-size:12px;padding:2px 8px;border-radius:5px;font-weight:500}
.src.db{background:color-mix(in srgb,var(--good) 15%,var(--surface));color:var(--good)}
.src.auto{background:color-mix(in srgb,var(--gold) 16%,var(--surface));color:var(--gold)}
.note{margin-top:12px;font-size:13px;color:var(--muted)}
.browser{margin-top:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.bbar{border-radius:10px 10px 0 0;display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--sunk)}
.dots{display:flex;gap:5px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.url{flex:1;min-width:0;font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--surface);border-radius:6px;padding:3px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.extico{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:13px;font-weight:700}
.bpage{position:relative;padding:18px 18px 22px;background:var(--surface);border-radius:0 0 10px 10px}
.bpage h3{font-family:var(--latin);font-size:19px;line-height:1.35;margin-bottom:10px}
.bpage p{font-family:var(--latin);font-size:15px;line-height:1.75}
.tk{cursor:pointer;border-radius:3px}
.tk:hover{background:color-mix(in srgb,var(--accent) 15%,transparent)}
.tk.on{background:color-mix(in srgb,var(--accent) 28%,transparent)}
.pop{position:absolute;z-index:5;width:min(300px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px 12px 10px}
.pop-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pop-w{font-family:var(--latin);font-weight:700;font-size:18px}
.pop .lego{gap:6px;margin-top:8px}
.pop-z{margin-top:8px;font-size:13.5px}
.pop-a{margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}

/* ---------- review ---------- */
.rv-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.stats{display:grid;gap:14px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat b{display:block;font-family:var(--latin);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.fc{display:block;width:100%;height:auto}
.fc .bar{fill:var(--accent)} .fc .bar0{fill:var(--root)}
.fc text{font-family:var(--mono);font-size:10px;fill:var(--muted);text-anchor:middle}
.fc .gl{stroke:var(--line);stroke-width:1}
.card{min-height:380px;display:flex;flex-direction:column}
.cq{color:var(--muted);font-size:14px}
.cq b{color:var(--ink)}
.cbig{font-family:var(--latin);font-weight:700;font-size:56px;line-height:1.1;margin:18px 0 6px;color:var(--c);overflow-wrap:anywhere}
.czh{font-family:var(--display);font-size:34px;margin:18px 0 6px}
.cwords{font-family:var(--latin);font-size:16px;color:var(--muted)}
.cwords b{color:var(--c)}
.cans{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.cans .mean{font-family:var(--display);font-size:26px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;font-family:var(--latin);font-size:18px;font-weight:600;text-align:center}
.opt:hover{border-color:var(--muted)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.spell{display:flex;gap:8px;margin-top:18px}
.spell input{font-family:var(--latin);font-size:20px}
.verdict{margin-top:12px;font-weight:700}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.cfoot{margin-top:auto;padding-top:20px}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.g{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;display:grid;gap:0;text-align:center}
.g b{font-size:14.5px}
.g span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.g:hover{border-color:var(--gc)}
.g.sugg{border-color:var(--gc);background:color-mix(in srgb,var(--gc) 10%,var(--surface))}
.kbd{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:10px;text-align:center}
.done{display:grid;place-items:center;text-align:center;gap:10px;flex:1}
.done h3{font-family:var(--display);font-size:26px}

/* ---------- puzzle ---------- */
.pz{max-width:820px;margin-inline:auto}
.pz-t{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.pz-zh{font-family:var(--display);font-size:40px;line-height:1.2;margin-top:4px}
.pz-hint{margin-top:6px;color:var(--muted);font-size:14px;min-height:1.6em}
.slot{margin-top:18px;min-height:112px;border:2px dashed var(--line);border-radius:12px;padding:18px 14px 12px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:0;background:var(--bg);transition:border-color .2s,background .2s}
.slot.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--bg))}
.slot.win{border-style:solid;border-color:var(--good);background:color-mix(in srgb,var(--good) 8%,var(--bg))}
.slot.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.slot .ph{color:var(--muted);font-size:13.5px;align-self:center;width:100%;text-align:center}
.bank{margin-top:22px;display:flex;flex-wrap:wrap;gap:16px 12px;padding-top:6px}
.bank .blk{cursor:grab}
.bank .blk.used{opacity:.25;pointer-events:none}
.pz-msg{margin-top:14px;min-height:1.6em;font-weight:500}
.pz-msg.ok{color:var(--good)} .pz-msg.no{color:var(--bad)}
.pz-act{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}

/* ---------- badges ---------- */
.regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.region{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center}
.ring{width:64px;height:64px}
.ring .bg{stroke:var(--sunk);fill:none;stroke-width:7}
.ring .fg{fill:none;stroke-width:7;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring text{font-family:var(--mono);font-size:13px;font-weight:600;fill:var(--ink);text-anchor:middle}
.region h3{font-family:var(--display);font-size:18px}
.tier{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:5px;margin-top:2px}
.tier.none{background:var(--sunk);color:var(--muted)}
.tier.bronze{background:color-mix(in srgb,var(--bronze) 18%,var(--surface));color:var(--bronze)}
.tier.silver{background:color-mix(in srgb,var(--silver) 22%,var(--surface));color:var(--silver)}
.tier.gold{background:color-mix(in srgb,var(--gold) 20%,var(--surface));color:var(--gold)}
.region .mini-r{font-family:var(--latin);font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.sec-h{font-family:var(--display);font-size:20px;margin:26px 0 12px}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ach{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center}
.medal{width:48px;height:48px}
.ach.locked .medal{opacity:.35;filter:grayscale(1)}
.ach h4{margin:0;font-size:15px}
.ach p{font-size:12.5px;color:var(--muted);line-height:1.45}
.ach .st{font-family:var(--mono);font-size:11px;color:var(--muted)}
.ach:not(.locked) .st{color:var(--good)}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .app{grid-template-columns:84px minmax(0,1fr)}
  .rail{padding:18px 8px}
  .brand{justify-content:center;padding:0 0 14px}
  .bname,.rail .widget{display:none}
  .nav a{flex-direction:column;gap:3px;padding:9px 4px;font-size:11.5px;text-align:center}
  .widget-inline{display:block}
  .widget-inline .wg{grid-template-columns:1fr auto;align-items:center}
  .ex-grid{grid-template-columns:230px minmax(0,1fr)}
  .ex-grid .detail{grid-column:2}
}
@media (max-width:820px){
  body{font-size:14.5px}
  .app{display:block}
  .rail{position:fixed;z-index:20;top:auto;left:0;right:0;bottom:0;height:auto;flex-direction:row;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line);overflow:visible}
  .brand{display:none}
  .nav{flex-direction:row;justify-content:space-around;width:100%}
  .nav a{flex:1;min-width:0;padding:6px 2px;font-size:11px}
  .main{padding-block:16px calc(90px + env(safe-area-inset-bottom,0px))}
  .top{margin-bottom:14px}
  .top h1{font-size:25px}
  .legend{display:none}
  .ex-grid,.sp-grid,.rv-grid{grid-template-columns:minmax(0,1fr)}
  .ex-grid .detail{grid-column:auto}
  .ex-list{position:static;max-height:none;padding:12px}
  .mlist{flex-direction:row;overflow-x:auto;overflow-y:hidden;gap:6px;padding-bottom:4px;scroll-snap-type:x proximity}
  .lg{display:contents}
  .lg-h{display:none}
  .lg-items{display:contents}
  .li{display:flex;flex-direction:column;align-items:flex-start;gap:0;width:auto;flex:none;border:1px solid var(--line);padding:6px 12px;scroll-snap-align:start}
  .li-m{max-width:120px}
  .li-n{display:none}
  .mapwrap{padding:4px}
  .wc-w{font-size:26px}
  .blk .bt{font-size:22px}
  .cbig{font-size:44px}
  .czh,.pz-zh{font-size:30px}
  .stats{grid-template-columns:1fr}
  .opts{grid-template-columns:minmax(0,1fr)}
  .g{padding:10px 2px}
  .kbd{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>

<body>
<div class="app">
  <nav class="rail" aria-label="主選單">
    <div class="brand"><span class="logo" aria-hidden="true">根</span><span class="bname">字根工坊</span></div>

      <a href="#explore" data-nav="explore"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="4.5" cy="5" r="2"/><circle cx="19.5" cy="5" r="2"/><circle cx="12" cy="21" r="1.8"/><path d="M9.8 10 6 6.4M14.2 10 18 6.4M12 15v4.2"/></svg><span>字根地圖</span></a>
      <a href="#split" data-nav="split"><svg viewBox="0 0 24 24"><rect x="2" y="10" width="6" height="8" rx="1"/><rect x="9" y="10" width="6" height="8" rx="1"/><rect x="16" y="10" width="6" height="8" rx="1"/><path d="M4 8V7M6 8V7M11 8V7M13 8V7M18 8V7M20 8V7"/></svg><span>拆解</span></a>
      <a href="#review" data-nav="review"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="13" height="14" rx="2"/><path d="M7.5 3.5H19a2 2 0 0 1 2 2V17"/><path d="m6.5 14 2.2 2.2 4-4.2"/></svg><span>複習</span></a>
      <a href="#puzzle" data-nav="puzzle"><svg viewBox="0 0 24 24"><path d="M4 8h4.2a2.3 2.3 0 1 1 4.6 0H17v4.2a2.3 2.3 0 1 1 0 4.6V21H4z"/></svg><span>積木</span></a>
      <a href="#badges" data-nav="badges"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="m8.6 14-1.6 8 5-2.8 5 2.8-1.6-8"/></svg><span>成就</span></a>
    </div>
    <div class="widget" id="widgetRail"></div>
  </nav>

  <main class="main">
    <header class="top">
      <div><h1 id="vTitle">字根地圖</h1><p id="vSub"></p></div>
      <div class="top-r">
        <span id="demoPill"></span>
        <div class="lvl" role="group" aria-label="單字程度" title="要顯示哪些程度的單字"><button data-level="1">基礎</button><button data-level="2">＋進階</button><button data-level="3">全部</button></div>
        <span class="acct-wrap" id="acctWrap" hidden><button class="acct" id="acctBtn" data-act="acct" aria-expanded="false"><i></i><span>登入同步</span></button><div class="acct-panel" id="acctPanel" hidden></div></span>
        <div class="legend" aria-label="顏色說明"><span><i style="--c:var(--pre)"></i>字首</span><span><i style="--c:var(--root)"></i>字根</span><span><i style="--c:var(--suf)"></i>字尾</span></div>
      </div>
    </header>

    <section class="view" id="v-explore">
      <div class="widget-inline" id="widgetInline"></div>
      <div class="ex-grid">
        <aside class="panel ex-list">
          <input type="search" id="exSearch" placeholder="搜尋字根、字義或單字" aria-label="搜尋字根">
          <div class="seg" role="group" aria-label="類型">
            <button data-tab="root">字根</button><button data-tab="pre">字首</button><button data-tab="suf">字尾</button>
          </div>
          <div class="mlist" id="mlist"></div>
        </aside>
        <div class="panel mapwrap">
          <div class="maphead"><span class="k" id="mapK"></span><span class="sub" id="mapN"></span></div>
          <svg class="map" id="map" viewBox="0 0 640 440" role="img" aria-label="字根關聯圖"></svg>
        </div>
        <div class="detail" id="detail"></div>
      </div>
    </section>

    <section class="view" id="v-split" hidden>
      <div class="sp-grid">
        <div class="panel">
          <h2>單字拆解</h2>
          <p class="sub">輸入英文單字。詞庫有收錄的字會顯示人工校對的拆法，沒收錄的字會用字首、字根、字尾表自動比對。</p>

          <div class="sp-out" id="spOut"></div>

          <div class="browser">
            <div class="bbar"><span class="dots"><i></i><i></i><i></i></span><span class="url">news.example.com/world/after-the-pandemic</span><span class="extico" aria-hidden="true">根</span></div>

    <section class="view" id="v-puzzle" hidden>

    </section>

    <section class="view" id="v-badges" hidden>
      <div id="bdg"></div>
    </section>
  </main>
</div>

<script>
/* ======================= data ======================= */
/* WORDBLOCKS_DATA_BEGIN */const DATA={"version":1,"categories":[{"id":"time","name":"時間與順序"},{"id":"dir","name":"方向與位置"},{"id":"num","name":"數量與程度"},{"id":"sense","name":"感官與表達"},{"id":"move","name":"動作與力量"},{"id":"mind","name":"心智與情感"},{"id":"life","name":"生命與群體"},{"id":"nature","name":"自然與空間"},{"id":"rel","name":"關係與否定"},{"id":"suf","name":"詞性字尾"}],"morphemes":[{"id":"pre","type":"pre","forms":"pre-","meaning":"預先、在…之前","origin":"拉丁語 prae","category":"time"},{"id":"fore","type":"pre","forms":"fore-","meaning":"前面、預先","origin":"古英語 fore","category":"time"},{"id":"retro","type":"pre","forms":"retro-","meaning":"向後","origin":"拉丁語 retro","category":"time"},{"id":"ana","type":"pre","forms":"ana-","meaning":"逆、向後","origin":"希臘語 ana","category":"time"},{"id":"circum","type":"pre","forms":"circum-","meaning":"環繞","origin":"拉丁語 circum","category":"dir"},{"id":"post","type":"pre","forms":"post-","meaning":"之後","origin":"拉丁語 post","category":"time"},{"id":"extra","type":"pre","forms":"extra-","meaning":"超出、額外","origin":"拉丁語 extra","category":"dir"},{"id":"ultra","type":"pre","forms":"ultra-","meaning":"超越","origin":"拉丁語 ultra","category":"dir"},{"id":"hypo","type":"pre","forms":"hypo-","meaning":"在下","origin":"希臘語 hypo","category":"dir"},{"id":"chron","type":"root","forms":"chron","meaning":"時間","origin":"希臘語 chronos","category":"time","story":"希臘語 chronos 就是「時間」。它常和泰坦神 Cronus（克洛諾斯）混為一談，兩者拼法相近，但詞源不同。","scene":"一座沙漏，沙子正緩緩落下。"},{"id":"pro","type":"pre","forms":"pro- / pur-","meaning":"向前、預先；代替","origin":"拉丁語 pro","category":"dir"},{"id":"de","type":"pre","forms":"de-","meaning":"向下；去除、反轉","origin":"拉丁語 de","category":"dir"},{"id":"in","type":"pre","forms":"in- / im-","meaning":"向內、進入","origin":"拉丁語 in","category":"dir"},{"id":"re","type":"pre","forms":"re-","meaning":"回、再","origin":"拉丁語 re-","category":"dir"},{"id":"trans","type":"pre","forms":"trans-","meaning":"跨越、轉移","origin":"拉丁語 trans","category":"dir"},{"id":"ex","type":"pre","forms":"ex- / e-","meaning":"向外","origin":"拉丁語 ex","category":"dir"},{"id":"sub","type":"pre","forms":"sub- / sup- / su-","meaning":"在下、從下","origin":"拉丁語 sub","category":"dir"},{"id":"super","type":"pre","forms":"super-","meaning":"在上、超越","origin":"拉丁語 super","category":"dir"},{"id":"inter","type":"pre","forms":"inter- / enter-","meaning":"在…之間","origin":"拉丁語 inter","category":"dir"},{"id":"ob","type":"pre","forms":"ob-","meaning":"對著、阻擋","origin":"拉丁語 ob","category":"dir"},{"id":"per","type":"pre","forms":"per-","meaning":"穿過、徹底；每","origin":"拉丁語 per","category":"dir"},{"id":"ab","type":"pre","forms":"ab-","meaning":"離開","origin":"拉丁語 ab","category":"dir"},{"id":"ad","type":"pre","forms":"ad- / ag-","meaning":"朝向","origin":"拉丁語 ad","category":"dir"},{"id":"para","type":"pre","forms":"para-","meaning":"旁邊","origin":"希臘語 para","category":"dir","story":"古希臘的抄寫者會在文字旁邊畫一條短線（paragraphos），提示讀者「這裡換段」。paragraph 就是「寫在旁邊的記號」。"},{"id":"infra","type":"pre","forms":"infra-","meaning":"在下方","origin":"拉丁語 infra","category":"dir"},{"id":"intro","type":"pre","forms":"intro-","meaning":"向內","origin":"拉丁語 intro","category":"dir"},{"id":"epi","type":"pre","forms":"epi-","meaning":"在…之上、散布","origin":"希臘語 epi","category":"dir"},{"id":"spect","type":"root","forms":"spect / spec / spic","meaning":"看","origin":"拉丁語 specere","category":"sense","story":"羅馬競技場裡坐滿的觀眾叫 spectatores，就是「來看的人」。英文 spectator 幾乎原封不動地繼承了這個字。","scene":"一隻大眼睛貼著放大鏡往外看。"},{"id":"vid","type":"root","forms":"vid / vis / vise / vide","meaning":"看","origin":"拉丁語 videre","category":"sense","story":"拉丁文 video 的意思就是「我看見」。現代的「影片」一字，直接借用了這個拉丁動詞。","scene":"一扇窗被推開，陽光照進來，什麼都看得見。"},{"id":"dict","type":"root","forms":"dict","meaning":"說","origin":"拉丁語 dicere","category":"sense","story":"verdict 來自古法語 verdit，字面是「說出的真話」（ver 真實 + dict 說）。陪審團宣布判決，就是說出他們認定的真相。","scene":"法官敲下法槌，嘴邊冒出一個對話框。"},{"id":"scrib","type":"root","forms":"scrib / scribe / script","meaning":"寫","origin":"拉丁語 scribere","category":"sense","story":"印刷術出現以前，抄寫書本的人叫 scribe（抄寫員）。manuscript 字面就是「用手寫成的」。","scene":"修道院裡，抄寫員用羽毛筆在羊皮紙上寫字。"},{"id":"graph","type":"root","forms":"graph","meaning":"寫、畫","origin":"希臘語 graphein","category":"sense","story":"希臘語 graphein 最初的意思是「刻、刮」。最早的文字刻在泥板與石頭上，後來才引申為「寫」與「畫」。","scene":"一支筆在紙上畫出一道曲線。"},{"id":"phon","type":"root","forms":"phon / phone","meaning":"聲音","origin":"希臘語 phone","category":"sense","story":"saxophone（薩克斯風）以發明者 Adolphe Sax 命名，字面就是「Sax 的聲音」。","scene":"聲波從喇叭口一圈圈擴散出去。"},{"id":"mon","type":"root","forms":"mon","meaning":"提醒、警告","origin":"拉丁語 monere","category":"sense","story":"羅馬人在卡比托利歐山上供奉「提醒者朱諾」（Juno Moneta），並在神廟旁鑄造錢幣。一般認為 money 與 mint（鑄幣廠）都由 Moneta 演變而來。","scene":"一根舉起的手指，旁邊亮著警示燈。"},{"id":"warn","type":"root","forms":"warn","meaning":"警告","origin":"古英語 warnian","category":"sense","story":"warn 是道地的日耳曼語字根，不是拉丁語。forewarn 用的是古英語字首 fore-，與拉丁語的 pre- 意思相同。"},{"id":"photo","type":"root","forms":"photo","meaning":"光","origin":"希臘語 phos","category":"sense"},{"id":"struct","type":"root","forms":"struct / stroy","meaning":"建造、堆疊","origin":"拉丁語 struere","category":"move","story":"拉丁語 struere 原意是「把東西一層層堆起來」。羅馬大道由下而上鋪了好幾層石材，最底下的大石塊撐住整條路：這正是 infrastructure「下方的建造」的畫面。","scene":"工人把磚塊一層層往上疊，牆慢慢長高。"},{"id":"port","type":"root","forms":"port","meaning":"搬運、攜帶","origin":"拉丁語 portare","category":"move","scene":"搬運工扛著木箱走上碼頭的跳板。"},{"id":"ject","type":"root","forms":"ject","meaning":"丟、投擲","origin":"拉丁語 iacere","category":"move","story":"iacere 是「丟」。jet（噴射）也來自同一個字根，想成「把東西用力射出去」。","scene":"一隻手把球用力丟向遠方。"},{"id":"mit","type":"root","forms":"mit / miss / mitt / mise / mess","meaning":"送、放出","origin":"拉丁語 mittere","category":"move","story":"天主教的「彌撒」（Mass）一般認為來自拉丁禮儀結尾的 \"Ite, missa est\"（去吧，散會了）。missa 正是 mittere「送出」的變化形。","scene":"一封信被投進郵筒，展翅飛走。"},{"id":"duc","type":"root","forms":"duc / duct / duce","meaning":"引導","origin":"拉丁語 ducere","category":"move","story":"羅馬的 dux 是「帶兵的領袖」，後來演變成英文的 duke（公爵）。","scene":"嚮導舉著小旗，帶著一列人往前走。"},{"id":"gress","type":"root","forms":"gress","meaning":"走、步伐","origin":"拉丁語 gradi","category":"move","story":"gradi「走、跨步」的名詞是 gradus「一步、一級台階」。英文的 grade（等級）與 gradual（逐步的）都來自同一家族。","scene":"一雙腳一階一階往上爬樓梯。"},{"id":"rupt","type":"root","forms":"rupt","meaning":"破裂","origin":"拉丁語 rumpere","category":"move","story":"法文的 route（路線）來自拉丁語 via rupta：「被劈開的路」，指在森林或岩石中硬開出來的道路。","scene":"一塊玻璃從中間裂開，碎片往外飛。"},{"id":"bio","type":"root","forms":"bio","meaning":"生命","origin":"希臘語 bios","category":"life","story":"希臘語 bios 指「生命、一生」。biography 就是「把一個人的一生寫下來」。","scene":"一株嫩芽從土裡探出頭。"},{"id":"dem","type":"root","forms":"dem / demo","meaning":"人民","origin":"希臘語 demos","category":"life","story":"古希臘雅典的 demos 指「全體公民」。democracy 就是「由人民統治」。","scene":"廣場上一群人一起舉手投票。"},{"id":"cred","type":"root","forms":"cred","meaning":"相信","origin":"拉丁語 credere","category":"mind","story":"基督教信經以拉丁文 Credo「我相信」開頭，英文 creed（信條）由此而來。","scene":"兩隻手相握，中間發著光。"},{"id":"pan","type":"root","forms":"pan","meaning":"全部","origin":"希臘語 pan","category":"life","story":"易混淆！pan-「全部」和 panic（恐慌）長得很像，但 panic 其實來自牧神 Pan。點選地圖上的 panic 看看它的故事。","scene":"一張 360 度的全景照片攤開成一圈。"},{"id":"panGod","type":"root","forms":"Pan","meaning":"牧神潘","origin":"希臘神話 Pan","category":"life","story":"希臘神話中的牧神潘（Pan）半人半羊，住在山林裡。傳說他會突然發出怪聲，讓旅人與敵軍陷入沒來由的驚慌，這種恐懼就叫 panic。","scene":"月光下的森林裡，羊角人影一閃而過。"},{"id":"manu","type":"root","forms":"manu","meaning":"手","origin":"拉丁語 manus","category":"life"},{"id":"ver","type":"root","forms":"ver","meaning":"真實","origin":"拉丁語 verus","category":"life"},{"id":"cracy","type":"root","forms":"cracy","meaning":"統治","origin":"希臘語 kratos","category":"life"},{"id":"orama","type":"root","forms":"orama","meaning":"景象","origin":"希臘語 horama","category":"life"},{"id":"acea","type":"root","forms":"acea","meaning":"治療","origin":"希臘語 akos","category":"life"},{"id":"bank","type":"root","forms":"bank","meaning":"長凳","origin":"義大利語 banca","category":"life","story":"中世紀義大利的錢商在長凳（banca）上做生意。傳說錢商破產時，他的長凳會被砸斷：banca rotta「斷掉的長凳」，後來成了 bankrupt。","scene":"市集裡一張木長凳從中間斷成兩截。"},{"id":"con","type":"pre","forms":"con- / com- / cor- / col- / co-","meaning":"一起；徹底","origin":"拉丁語 com","category":"rel"},{"id":"syn","type":"pre","forms":"syn- / sym-","meaning":"一起、同時","origin":"希臘語 syn","category":"rel"},{"id":"un","type":"pre","forms":"un-","meaning":"不","origin":"古英語 un-","category":"rel"},{"id":"inneg","type":"pre","forms":"in- / im- / ir- / il-（否定）","meaning":"不、無","origin":"拉丁語 in-","category":"rel"},{"id":"dis","type":"pre","forms":"dis-","meaning":"分開；否定","origin":"拉丁語 dis","category":"rel"},{"id":"contra","type":"pre","forms":"contra-","meaning":"相反","origin":"拉丁語 contra","category":"rel"},{"id":"anti","type":"pre","forms":"anti- / ant-","meaning":"對抗","origin":"希臘語 anti","category":"rel"},{"id":"auto","type":"pre","forms":"auto-","meaning":"自己","origin":"希臘語 autos","category":"rel"},{"id":"micro","type":"pre","forms":"micro-","meaning":"微小","origin":"希臘語 mikros","category":"rel"},{"id":"tele","type":"pre","forms":"tele-","meaning":"遠","origin":"希臘語 tele","category":"rel"},{"id":"uni","type":"pre","forms":"uni-","meaning":"單一","origin":"拉丁語 unus","category":"num"},{"id":"bi","type":"pre","forms":"bi-","meaning":"二、雙","origin":"拉丁語 bi-","category":"num"},{"id":"tri","type":"pre","forms":"tri-","meaning":"三","origin":"拉丁語 tri-","category":"num"},{"id":"mono","type":"pre","forms":"mono- / mon-","meaning":"單一、獨自","origin":"希臘語 monos","category":"num"},{"id":"multi","type":"pre","forms":"multi-","meaning":"許多","origin":"拉丁語 multus","category":"num"},{"id":"cent","type":"pre","forms":"cent- / centi-","meaning":"百","origin":"拉丁語 centum","category":"num","story":"centipede 字面是「百足」，但蜈蚣的腳是奇數對，所以從來不會剛好 100 隻。","scene":"一隻蜈蚣在數自己的腳。"},{"id":"semi","type":"pre","forms":"semi-","meaning":"一半","origin":"拉丁語 semi-","category":"num"},{"id":"peri","type":"pre","forms":"peri-","meaning":"周圍","origin":"希臘語 peri","category":"dir"},{"id":"dia","type":"pre","forms":"dia-","meaning":"穿過、橫越","origin":"希臘語 dia","category":"dir"},{"id":"sur","type":"pre","forms":"sur-","meaning":"在上、超過","origin":"古法語 sur","category":"dir"},{"id":"se","type":"pre","forms":"se-","meaning":"分開、離開","origin":"拉丁語 se-","category":"dir"},{"id":"extro","type":"pre","forms":"extro-","meaning":"向外","origin":"拉丁語 extra","category":"dir"},{"id":"en","type":"pre","forms":"en- / em-","meaning":"使…、進入","origin":"古法語 en-","category":"dir"},{"id":"non","type":"pre","forms":"non-","meaning":"非、不","origin":"拉丁語 non","category":"rel"},{"id":"an","type":"pre","forms":"a- / an-","meaning":"沒有、無","origin":"希臘語 a-","category":"rel"},{"id":"bene","type":"pre","forms":"bene-","meaning":"好、善","origin":"拉丁語 bene","category":"rel"},{"id":"mal","type":"pre","forms":"mal- / male-","meaning":"壞、惡","origin":"拉丁語 male","category":"rel"},{"id":"cede","type":"root","forms":"cede / ceed / cess","meaning":"走、讓步","origin":"拉丁語 cedere","category":"move"},{"id":"fer","type":"root","forms":"fer","meaning":"攜帶","origin":"拉丁語 ferre","category":"move"},{"id":"tract","type":"root","forms":"tract","meaning":"拉","origin":"拉丁語 trahere","category":"move"},{"id":"press","type":"root","forms":"press","meaning":"壓","origin":"拉丁語 premere","category":"move"},{"id":"pend","type":"root","forms":"pend / pens","meaning":"懸掛；秤重付錢","origin":"拉丁語 pendere","category":"move","story":"拉丁語 pendere 是「懸掛」，也是「秤重」。古代用天平秤金屬付錢，所以 pens 常和錢有關：expense（花費）、pension（退休金）、compensate（補償）都來自這裡。","scene":"一座天平，一邊掛著錢袋。"},{"id":"vert","type":"root","forms":"vert / vers / verse","meaning":"轉","origin":"拉丁語 vertere","category":"move"},{"id":"cap","type":"root","forms":"cap / capt / cept / ceive","meaning":"拿、抓","origin":"拉丁語 capere","category":"move","story":"易混淆！captain（船長）、capital（首都）的 cap 來自 caput「頭」，不是 capere「拿」。看到 cap 先想想：是「抓」還是「頭」？","scene":"一隻手猛地抓住飛來的球。"},{"id":"fact","type":"root","forms":"fact / fac / fect / fic / fit","meaning":"做","origin":"拉丁語 facere","category":"move"},{"id":"vent","type":"root","forms":"vent / ven / vene","meaning":"來","origin":"拉丁語 venire","category":"move","story":"adventure 原本指「即將來臨的事」，中世紀騎士故事用它來形容旅途中迎面而來的未知與挑戰。","scene":"一扇門打開，有人正走進來。"},{"id":"tend","type":"root","forms":"tend / tens / tense / tent","meaning":"伸展","origin":"拉丁語 tendere","category":"move"},{"id":"clud","type":"root","forms":"clud / clude / clus","meaning":"關閉","origin":"拉丁語 claudere","category":"move"},{"id":"mot","type":"root","forms":"mot / mote / mob","meaning":"移動","origin":"拉丁語 movere","category":"move"},{"id":"cur","type":"root","forms":"cur / curr / curs","meaning":"跑、流","origin":"拉丁語 currere","category":"move"},{"id":"flu","type":"root","forms":"flu","meaning":"流","origin":"拉丁語 fluere","category":"move","story":"中世紀的義大利人相信疾病是星辰「流入」人間造成的，所以把流行病叫 influenza（影響），英文的 flu（流感）就是它的縮寫。","scene":"夜空中的星光像水一樣流下來。"},{"id":"ped","type":"root","forms":"ped / pede","meaning":"腳","origin":"拉丁語 pes, pedis","category":"move"},{"id":"pod","type":"root","forms":"pod","meaning":"腳","origin":"希臘語 pous, podos","category":"move"},{"id":"lect","type":"root","forms":"lect","meaning":"選；讀","origin":"拉丁語 legere","category":"move"},{"id":"aud","type":"root","forms":"aud","meaning":"聽","origin":"拉丁語 audire","category":"sense"},{"id":"voc","type":"root","forms":"voc / voke","meaning":"聲音、呼喚","origin":"拉丁語 vocare","category":"sense"},{"id":"sign","type":"root","forms":"sign","meaning":"記號","origin":"拉丁語 signum","category":"sense"},{"id":"scope","type":"root","forms":"scope","meaning":"看","origin":"希臘語 skopein","category":"sense"},{"id":"lingu","type":"root","forms":"lingu","meaning":"舌頭、語言","origin":"拉丁語 lingua","category":"sense","story":"拉丁語 lingua 是「舌頭」。說話要用舌頭，所以它也指「語言」，英文的 language 就來自同一個字。","scene":"一條舌頭上站著好幾個國家的小旗子。"},{"id":"ton","type":"root","forms":"ton / tone","meaning":"聲調","origin":"希臘語 tonos","category":"sense"},{"id":"log","type":"root","forms":"log / logue","meaning":"話語","origin":"希臘語 logos","category":"sense"},{"id":"onym","type":"root","forms":"onym","meaning":"名字","origin":"希臘語 onyma","category":"sense"},{"id":"fac","type":"root","forms":"face / fac / fic","meaning":"臉、面","origin":"拉丁語 facies","category":"sense"},{"id":"sens","type":"root","forms":"sens / sense / sent","meaning":"感覺","origin":"拉丁語 sentire","category":"mind"},{"id":"cord","type":"root","forms":"cord / cour","meaning":"心","origin":"拉丁語 cor, cordis","category":"mind","story":"拉丁語 cor 是「心」。古人認為記憶存在心裡，所以 record 原意是「再次記在心上」。英文 learn by heart（背起來）也是同樣的想法。","scene":"一顆心形的錄音機正在錄音。"},{"id":"path","type":"root","forms":"path","meaning":"感受、痛苦","origin":"希臘語 pathos","category":"mind"},{"id":"phil","type":"root","forms":"phil / philo","meaning":"愛","origin":"希臘語 philos","category":"mind","story":"美國城市費城 Philadelphia 的名字來自希臘語：philos「愛」+ adelphos「兄弟」，意思是「兄弟之愛的城市」。","scene":"兩隻手一起捧著一顆心。"},{"id":"soph","type":"root","forms":"soph","meaning":"智慧","origin":"希臘語 sophia","category":"mind"},{"id":"vol","type":"root","forms":"vol","meaning":"意願","origin":"拉丁語 volo","category":"mind"},{"id":"spir","type":"root","forms":"spir / spire / pire","meaning":"呼吸","origin":"拉丁語 spirare","category":"life","story":"expire 字面是「吐出一口氣」，最早指「嚥下最後一口氣」。現在護照、牛奶「到期」也用 expire。","scene":"冬天裡呼出一團白霧。"},{"id":"mort","type":"root","forms":"mort","meaning":"死","origin":"拉丁語 mors, mortis","category":"life","story":"mortgage 字面是「死亡的誓約」（古法語 mort gage）：借款還清時，誓約就「死了」；還不出來，抵押的土地就「死」給了債主。","scene":"一張契約上壓著一把舊鑰匙。"},{"id":"viv","type":"root","forms":"viv / vive / vit","meaning":"活","origin":"拉丁語 vivere","category":"life"},{"id":"gen","type":"root","forms":"gen / gener","meaning":"產生、出生","origin":"希臘語 genos","category":"life","story":"18 世紀末，法國化學家拉瓦節以為所有酸都含有同一種元素，就把它命名為 oxygène，「產生酸的東西」。後來證明他錯了，但名字留了下來。hydrogen 則是「產生水的東西」。","scene":"燒杯裡冒出一串氣泡。"},{"id":"anthrop","type":"root","forms":"anthrop","meaning":"人類","origin":"希臘語 anthropos","category":"life"},{"id":"arch","type":"root","forms":"arch","meaning":"統治","origin":"希臘語 arkhein","category":"life"},{"id":"gage","type":"root","forms":"gage","meaning":"誓約","origin":"古法語 gage","category":"life"},{"id":"nov","type":"root","forms":"nov","meaning":"新","origin":"拉丁語 novus","category":"time","story":"novel（小說）原意是「新鮮事」，指和古老傳說不同、講新故事的作品。","scene":"一本書翻開，冒出嫩芽。"},{"id":"fin","type":"root","forms":"fin / fine","meaning":"結束、界限","origin":"拉丁語 finis","category":"time"},{"id":"geo","type":"root","forms":"geo","meaning":"地球、土地","origin":"希臘語 ge","category":"nature","story":"古埃及的尼羅河每年氾濫，沖掉田界，人們得重新丈量土地。希臘人把這門學問叫 geometria「測量土地」，也就是幾何學。","scene":"一位測量員拉著繩子丈量田地。"},{"id":"terr","type":"root","forms":"terr","meaning":"土地","origin":"拉丁語 terra","category":"nature"},{"id":"medi","type":"root","forms":"medi","meaning":"中間","origin":"拉丁語 medius","category":"nature"},{"id":"loc","type":"root","forms":"loc","meaning":"地方","origin":"拉丁語 locus","category":"nature"},{"id":"meter","type":"root","forms":"meter / metr","meaning":"測量","origin":"希臘語 metron","category":"nature"},{"id":"therm","type":"root","forms":"therm / thermo","meaning":"熱","origin":"希臘語 thermos","category":"nature"},{"id":"hydr","type":"root","forms":"hydr / hydro","meaning":"水","origin":"希臘語 hydor","category":"nature"},{"id":"oxy","type":"root","forms":"oxy","meaning":"尖銳、酸","origin":"希臘語 oxys","category":"nature"},{"id":"form","type":"root","forms":"form","meaning":"形狀","origin":"拉丁語 forma","category":"nature"},{"id":"cycl","type":"root","forms":"cycl / cycle","meaning":"圓、循環","origin":"希臘語 kyklos","category":"nature"},{"id":"angl","type":"root","forms":"angl / angle","meaning":"角","origin":"拉丁語 angulus","category":"nature"},{"id":"rect","type":"root","forms":"rect","meaning":"直、正","origin":"拉丁語 rectus","category":"nature"},{"id":"corn","type":"root","forms":"corn","meaning":"角（獸角）","origin":"拉丁語 cornu","category":"nature","story":"cornu 是「角」。獨角獸 unicorn 是蘇格蘭的國獸，至今仍出現在英國皇家紋章上。","scene":"一隻白馬額頭長出一支螺旋角。"},{"id":"tain","type":"root","forms":"tain / ten / tin / tent","meaning":"握住、保持","origin":"拉丁語 tenere","category":"move","story":"maintain 字面是「用手握住」（拉丁語 manu tenere）：要維持一樣東西，就得一直把它握在手裡。","scene":"一雙手穩穩捧著一個玻璃球。"},{"id":"tect","type":"root","forms":"tect","meaning":"遮蓋","origin":"拉丁語 tegere","category":"move","story":"易混淆：protect 的 tect 來自 tegere「遮蓋」，contact 的 tact 來自 tangere「接觸」。有些字根表把兩者混在一起，其實是不同的字根。","scene":"一把大傘遮住底下的小屋。"},{"id":"cid","type":"root","forms":"cid / cas / cide","meaning":"落下、發生","origin":"拉丁語 cadere","category":"move"},{"id":"plic","type":"root","forms":"plic / ply","meaning":"摺疊","origin":"拉丁語 plicare","category":"move","story":"拉丁語 plicare 是「摺疊」。complicated（複雜）是「摺在一起」；simple（簡單）原意則是「只摺一層」。","scene":"一張紙被摺了又摺，變成紙鶴。"},{"id":"tact","type":"root","forms":"tact","meaning":"接觸","origin":"拉丁語 tangere","category":"sense"},{"id":"quir","type":"root","forms":"quir / quire / quest / quisit","meaning":"尋找、要求","origin":"拉丁語 quaerere","category":"mind","story":"question（問題）和 quest（探索）都來自 quaerere「尋找」：提問，就是出發去尋找答案。","scene":"一個人提著燈籠在夜裡找東西。"},{"id":"cura","type":"root","forms":"cur / cure","meaning":"照料、擔心","origin":"拉丁語 cura","category":"mind","story":"拉丁語 cura 是「照料、擔心」。secure 字面是「免於擔心」（se 分開 + cura）；醫生 cure 病人，也是在照料他。","scene":"護士正在替病人蓋好被子。"},{"id":"nat","type":"root","forms":"nat","meaning":"出生","origin":"拉丁語 nasci","category":"life"},{"id":"part","type":"root","forms":"part","meaning":"部分","origin":"拉丁語 pars","category":"nature"},{"id":"sta","type":"root","forms":"sta / stat / stance / stant / stitute / sist","meaning":"站立","origin":"拉丁語 stare、sistere","category":"move","story":"拉丁語 stare 是「站」。exist 字面是「站出來」：真的站在你面前，才算存在；assistant 則是「站在旁邊幫忙的人」。","scene":"一個人穩穩站在台座上。"},{"id":"pos","type":"root","forms":"pos / posit / pose / pon / pone / pound","meaning":"放置","origin":"拉丁語 ponere","category":"move"},{"id":"act","type":"root","forms":"act / ag","meaning":"做、驅動","origin":"拉丁語 agere","category":"move"},{"id":"sequ","type":"root","forms":"sequ / secu / sue","meaning":"跟隨","origin":"拉丁語 sequi","category":"move"},{"id":"sum","type":"root","forms":"sum / sume / sumpt","meaning":"拿取、取用","origin":"拉丁語 sumere","category":"move"},{"id":"volv","type":"root","forms":"volv / volve / volut","meaning":"捲、滾動","origin":"拉丁語 volvere","category":"move"},{"id":"pel","type":"root","forms":"pel / puls","meaning":"推、驅使","origin":"拉丁語 pellere","category":"move"},{"id":"fus","type":"root","forms":"fus / fuse / fund","meaning":"傾倒、熔化","orig function autoSeg(s){
  const n=s.length, PH={pre:0,root:1,suf:2}, best=new Map(), key=(i,p,r)=>i+'|'+p+'|'+r;
  best.set(key(0,0,0),{c:0,back:null});
  for(let i=0;i<n;i++) for(let p=0;p<3;p++) for(let r=0;r<2;r++){
    const cur=best.get(key(i,p,r)); if(!cur) continue;
    const relax=(j,np,nr,cost,seg)=>{const k=key(j,np,nr),c=cur.c+cost,o=best.get(k); if(!o||c<o.c) best.set(k,{c,back:{k:key(i,p,r),seg}});};
    for(const f of FORMS){
      if(!s.startsWith(f.t,i)) continue;
      const fp=PH[f.type]; if(fp<p) continue; if(f.type==='suf'&&!r) continue;
      relax(i+f.t.length,fp,(r||f.type==='root')?1:0,1+(f.t.length<=2?.9:0)+(f.t.length===1?1:0),{id:f.id,t:f.t});
    }
    relax(i+1,p,r,'aeiou'.includes(s[i])?1.4:2.6,{id:null,t:s[i]});
  }
  let end=null; for(let p=0;p<3;p++){const o=best.get(key(n,p,1)); if(o&&(!end||o.c<end.c)) end=o;}
  if(!end) return null;
  const segs=[]; let node=end; while(node&&node.back){segs.unshift(node.back.seg); node=best.get(node.back.k);}
  const out=[]; segs.forEach(g=>{ const l=out[out.length-1]; if(!g.id&&l&&!l.id) l.t+=g.t; else out.push({...g}); });
  const unk=out.filter(g=>!g.id).reduce((a,g)=>a+g.t.length,0);
  return unk/n>.45?null:out;
}
function analyze(raw){
  const s=String(raw).toLowerCase().replace(/[^a-z]/g,''); if(!s) return null;
  if(W[s]) return {...W[s],source:'db'};
  for(const [a,b] of [['ies','y'],['ied','y'],['ing','e'],['ing',''],['ed','e'],['ed',''],['d',''],['es',''],['s','']]){
    if(s.endsWith(a)){ const base=s.slice(0,-a.length)+b; if(W[base]) return {...W[base],source:'db',from:s}; }
  }
  const seg=autoSeg(s);
  if(seg) return {w:s,parts:seg,source:'auto',lit:seg.map(p=>p.id?short(M[p.id].mean):'（連接）').join(' + ')};
  return {w:s,source:'none'};
}

/* ======================= review (SRS) ======================= */
const NEW_LIMIT=8;
let rv=null;
function buildQueue(extraNew=0){
  const now=Date.now();
  const due=DECK.filter(id=>st.cards[id]&&st.cards[id].due<=now).sort((a,b)=>st.cards[a].due-st.cards[b].due);
  const room=Math.max(0,NEW_LIMIT-st.newDay.n)+extraNew;
  const fresh=DECK.filter(id=>!st.cards[id]).sort((a,b)=>(M[b].type==='root')-(M[a].type==='root')).slice(0,room);
  return [...due,...fresh];
}
function initSession(extraNew=0){ rv={queue:buildQueue(extraNew),done:0,q:null}; rv.q=rv.queue.length?makeQ(rv.queue[0]):null; }
function startSession(extraNew=0){ initSession(extraNew); renderReview(); }
function nextCard(){ rv.q=rv.queue.length?makeQ(rv.queue[0]):null; renderReview(); }
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function makeQ(id){
  const c=st.cards[id], ws=shown(id).length?shown(id):wordsWith(id), m=M[id];
  let mode=(!c||c.reps===0)?'meaning':pick(['meaning','choose','spell']);
  const toks=x=>x.mean.split(/[、；（）]/).filter(Boolean);
  const mine=toks(m); const similar=new Set(Object.values(M).filter(x=>toks(x).some(t=>mine.includes(t))).map(x=>x.id));
  const others=WORDS.filter(w=>vis(w)&&!w.parts.some(p=>similar.has(p.id)));
  if(mode==='choose'&&others.length<3) mode='meaning';
  const q={id,mode,revealed:false,ok:null};
  if(mode==='meaning') q.examples=shuffle(ws).slice(0,2);
  if(mode==='choose'){ q.target=pick(ws); q.opts=shuffle([q.target,...shuffle(others).slice(0,3)]); }
  if(mode==='spell'){ const neg=ws.filter(w=>w.parts.some(p=>['inneg','un','dis','anti','contra'].includes(p.id))&&w.parts[0].id!==id); q.neg=neg.length>0; q.target=pick(neg.length?neg:ws); }
  return q;
}
function nextState(c,g){
  c=c?{...c}:{ease:2.5,ivl:0,reps:0,lapses:0}; const now=Date.now();
  if(g===0){ c.reps=0; c.lapses++; c.ease=Math.max(1.3,c.ease-.2); c.ivl=0; c.due=now+6e4; }
  else if(g===1){ if(c.reps===0){c.ivl=0;c.due=now+6e5;} else {c.ivl=Math.max(1,Math.round(c.ivl*1.2));c.due=now+c.ivl*DAY;} c.ease=Math.max(1.3,c.ease-.15); c.reps++; }
  else if(g===2){ c.ivl=c.reps===0?1:c.reps===1?3:Math.round(Math.max(c.ivl,1)*c.ease); c.due=now+c.ivl*DAY; c.reps++; }
  else { c.ivl=c.reps===0?4:Math.round(Math.max(c.ivl,1)*c.ease*1.3); c.ease+=.15; c.due=now+c.ivl*DAY; c.reps++; }
  c.last=g; c.t=now; return c;
}
function fmtDur(ms){ const m=Math.round(ms/6e4); if(m<60) return `${Math.max(1,m)} 分`; const h=Math.round(m/60); if(h<24) return `${h} 小時`; const d=Math.round(ms/DAY); if(d<31) return `${d} 天`; return `${(d/30).toFixed(d<300?1:0)} 個月`; }
function grade(g){
  const q=rv.q; if(!q||!q.revealed) return;
  const isNew=!st.cards[q.id];
  st.cards[q.id]=nextState(st.cards[q.id],g);
  if(isNew) st.newDay.n++;
  const t=todayStr(); if(!st.days.includes(t)) st.days.push(t);
  rv.queue.shift(); rv.done++;
  if(g===0) rv.queue.push(q.id);
  save(); nextCard(); renderList();
}
function streak(){ let n=0; const set=new Set(st.days); let t=Date.now(); if(!set.has(todayStr(t))) t-=DAY; while(set.has(todayStr(t))){n++;t-=DAY;} return n; }
function renderStats(){
  const now=Date.now(), learned=DECK.filter(isLearned).length;
  const dueNow=DECK.filter(id=>st.cards[id]&&st.cards[id].due<=now).length;
  const newLeft=Math.min(Math.max(0,NEW_LIMIT-st.newDay.n),DECK.filter(id=>!st.cards[id]).length);
  const sod=new Date(); sod.setHours(0,0,0,0);
  const days=[...Array(7)].map((_,i)=>DECK.filter(id=>{const c=st.cards[id]; if(!c) return false; const end=sod.getTime()+(i+1)*DAY; const start=i===0?-Infinity:sod.getTime()+i*DAY; return c.due>=start&&c.due<end;}).length);
  const mx=Math.max(4,...days), bw=26, gap=12, H=90;
  const lbl=['今天','明天','+2','+3','+4','+5','+6'];
  const bars=days.map((v,i)=>{const h=Math.round(v/mx*(H-30)); const x=8+i*(bw+gap); return `<rect class="bar${i===0?' bar0':''}" x="${x}" y="${H-18-h}" width="${bw}" height="${Math.max(h,1)}" rx="3"/><text x="${x+bw/2}" y="${H-4}">${lbl[i]}</text>${v?`<text x="${x+bw/2}" y="${H-22-h}">${v}</text>`:''}`;}).join('');
  $('#rvStats').innerHTML=`<div><h2>今日進度</h2><p class="sub">每天最多 ${NEW_LIMIT} 張新卡，舊卡依記憶強度排程。</p></div>
    <div class="stat-row"><div class="stat"><b>${rv?rv.queue.length:dueNow}</b><span>本輪剩餘</span></div><div class="stat"><b>${newLeft}</b><span>今日新卡</span></div><div class="stat"><b>${learned}</b><span>已學會</span></div></div>
    <div><div class="k" style="margin-bottom:6px">未來 7 天到期</div><svg class="fc" viewBox="0 0 270 ${H}" role="img" aria-label="未來七天到期卡片數"><line class="gl" x1="0" x2="270" y1="${H-18}" y2="${H-18}"/>${bars}</svg></div>
    <div class="stat"><b>${streak()} 天</b><span>連續學習</span></div>`;
}
function renderReview(){
  if(!rv) initSession();
  renderStats();
  const el=$('#rvCard');
  const q=rv.q;
  if(!q){
    el.innerHTML=`<div class="done"><div><h3>今天的卡片都完成了</h3><p class="sub" style="margin-top:6px">這一輪複習了 ${rv.done} 張。明天再回來，到期的卡會自動排進來。</p></div><button class="btn pri" data-act="morenew">再學 5 張新卡</button></div>`;
    return;
  }
  const m=M[q.id], c=st.cards[q.id];
  const head=`<div class="cq"><span class="tchip" style="--c:var(--${m.type})">${TYPE_NAME[m.type]}</span> <span class="k">${c?'複習':'新卡'} · 剩 ${rv.queue.length} 張</span></div>`;
  let body='';
  if(q.mode==='meaning'){
    body=`<p class="cq" style="margin-top:14px">這個${TYPE_NAME[m.type]}是什麼意思？</p><div class="cbig" style="--c:var(--${m.type})">${esc(m.forms)}</div>
      <div class="cwords" style="--c:var(--${m.type})">${q.examples.map(w=>w.parts.map(p=>p.id===q.id?`<b>${esc(p.t)}</b>`:esc(p.t)).join('')).join('　·　')}</div>
      ${q.revealed?`<div class="cans"><div class="mean">${esc(m.mean)}</div><div class="mc-o">${esc(m.origin)}</div>${q.examples.map(w=>`<div style="margin-top:10px">${lego(w.parts,{mini:true,link:false})}<p class="sub" style="margin-top:4px">${esc(w.w)}：${esc(w.zh)}</p></div>`).join('')}</div>`:''}`;
  } else if(q.mode==='choose'){
    body=`<p class="cq" style="margin-top:14px">哪一個單字含有${TYPE_NAME[m.type]}「<b>${esc(m.mean)}</b>」？</p><div class="opts">${q.opts.map((w,i)=>{let cls='opt'; if(q.revealed){ if(w===q.target) cls+=' right'; else if(q.picked===i) cls+=' wrong'; } return `<button class="${cls}" data-act="choose" data-i="${i}" ${q.revealed?'disabled':''}>${esc(w.w)}</button>`;}).join('')}</div>
      ${q.revealed?`<p class="verdict ${q.ok?'ok':'no'}">${q.ok?'答對了':'差一點'}，答案是 ${esc(q.target.w)}（${esc(q.target.zh)}）</p>${lego(q.target.parts,{mini:true,link:false})}`:''}`;
  } else {
    const t=q.target;
    const hint=t.parts.map(p=>p.id===q.id?esc(p.t):'＿'.repeat(Math.max(2,Math.ceil(p.t.length/2)))).join(' + ');
    body=`<p class="cq" style="margin-top:14px">${q.neg?`請拼出含有 <b>${esc(m.label)}</b> 的否定形單字`:`請拼出含有 <b>${esc(m.label)}</b> 的單字`}</p><div class="czh">${esc(t.zh)}</div><p class="sub">${esc(t.lit)}　｜　${hint}</p>
      <form class="spell" data-form="spell"><input type="text" id="spellIn" autocomplete="off" spellcheck="false" placeholder="輸入英文單字" aria-label="拼出單字" ${q.revealed?'disabled':''} value="${esc(q.typed||'')}"><button class="btn pri" ${q.revealed?'disabled':''}>檢查</button></form>
      ${q.revealed?`<p class="verdict ${q.ok?'ok':'no'}">${q.ok?'拼對了':'答案是 '+esc(t.w)}</p>${lego(t.parts,{mini:true,link:false})}`:''}`;
  }
  let foot;
  if(!q.revealed){
    foot = q.mode==='meaning'?`<button class="btn pri" style="width:100%;padding:12px" data-act="reveal">顯示答案</button><p class="kbd">空白鍵：顯示答案</p>`:`<p class="kbd">${q.mode==='choose'?'點選一個答案':'輸入後按 Enter'}</p>`;
  } else {
    const G=[['重來','--bad'],['困難','--gold'],['良好','--good'],['簡單','--accent']];
    const sug=q.ok===false?0:q.ok===true?2:-1;
    foot=`<div class="grades">${G.map(([n,col],g)=>`<button class="g${g===sug?' sugg':''}" style="--gc:var(${col})" data-act="grade" data-g="${g}"><b>${n}</b><span>${fmtDur(nextState(c,g).due-Date.now())}</span></button>`).join('')}</div><p class="kbd">鍵盤 1–4 評分</p>`;
  }
  el.innerHTML=head+body+`<div class="cfoot">${foot}</div>`;
  runAnims(el);
  if(q.mode==='spell'&&!q.revealed){ const i=$('#spellIn'); if(i&&ui.view==='review'&&matchMedia('(min-width:821px)').matches) i.focus(); }
}

/* ======================= puzzle ======================= */
let pz=null;
function newPuzzle(first=false){
  if(first){
    const tiles=['fore','warn','pre','mon','ion=ition','dict','ject','struct'].map(s=>{const [id,t]=s.split('=');return {id,t:t||id};});
    pz={zh:'預先警告',hint:'兩種拼法都對：古英語的 fore + warn，或拉丁語的 pre + mon + ition（預感）',answers:['forewarn','premonition'],main:W.forewarn,tiles:shuffle(tiles),placed:[],state:null};
  } else {
    const cands=WORDS.filter(w=>vis(w)&&w.parts.length>=2&&(!pz||!pz.answers.includes(w.w)));
    const w=pick(cands); const texts=new Set(w.parts.map(p=>p.t)); const extra=[];
    shuffle(WORDS).forEach(o=>o.parts.forEach(p=>{ if(extra.length<4&&!texts.has(p.t)&&o!==w){ texts.add(p.t); extra.push(p); } }));
    pz={zh:w.zh,hint:w.lit,answers:[w.w],main:w,tiles:shuffle([...w.parts,...extra]),placed:[],state:null};
  }
  pz.showHint=false; renderPuzzle();
}
function renderPuzzle(){
  if(!pz) newPuzzle(true);
  const placed=pz.placed.map(i=>pz.tiles[i]);
  const str=placed.map(p=>p.t).join('');
  let msg='';
  if(pz.state==='win'){ const w=W[str]||pz.main; msg=`<p class="pz-msg ok">拼對了！${esc(str)} = ${esc(placed.map(p=>p.t).join(' + '))}，${esc(w.zh)}。${pz.answers.length>1?`另一個答案是 ${esc(pz.answers.find(a=>a!==str))}。`:''}</p>`; }
  else if(pz.state==='no') msg=`<p class="pz-msg no">拼出來是 ${esc(str)}，還不是答案。點一下槽裡的積木可以拿掉它。</p>`;
  else msg=`<p class="pz-msg"></p>`;
  $('#pz').innerHTML=`<div class="pz-t"><div><div class="k">請拼出意思是</div><div class="pz-zh">${esc(pz.zh)}</div></div><div class="stat" style="text-align:right"><b>${st.counters.puzzles}</b><span>已完成題數</span></div></div>
    <p class="pz-hint">${pz.showHint?'提示：'+esc(pz.hint):''}</p>
    <div class="slot${pz.state==='win'?' win':''}" id="slot" aria-label="拼字槽">${placed.length?placed.map((p,k)=>blk(p,{link:false}).replace('<span class="blk','<button data-act="unplace" data-k="'+k+'" title="拿掉" class="blk').replace(/<\/span>$/,'</button>')).join(''):'<span class="ph">把下方積木拖進來，或直接點選積木</span>'}</div>
    ${msg}
    <div class="bank" id="bank">${pz.tiles.map((p,i)=>blk(p,{link:false}).replace('<span class="blk','<button draggable="true" data-act="place" data-i="'+i+'" class="blk'+(pz.placed.includes(i)?' used':'')).replace(/<\/span>$/,'</button>')).join('')}</div>
    <div class="pz-act">${pz.state==='win'?'<button class="btn pri" data-act="pznext">下一題</button>':'<button class="btn pri" data-act="pzcheck">檢查</button><button class="btn" data-act="pzclear">清空</button><button class="btn" data-act="pzhint">提示</button><button class="btn" data-act="pznext">換一題</button>'}</div>`;
}
function pzCheck(){
  const str=pz.placed.map(i=>pz.tiles[i].t).join('');
  if(!str) return;
  if(pz.answers.includes(str)){ pz.state='win'; st.counters.puzzles++; save(); }
  else pz.state='no';
  renderPuzzle();
  if(pz.state==='no'&&!reduced){ const s=$('#slot'); s.classList.add('shake'); }
}

/* ======================= badges ======================= */
const ACH=[
  ['first','拆解新手','第一次用拆解實驗室分析單字',()=>st.counters.split>=1,()=>`${Math.min(st.counters.split,1)}/1`,'--pre'],
  ['ext','外掛探員','在網頁外掛預覽中查詢一個單字',()=>st.counters.ext>=1,()=>`${Math.min(st.counters.ext,1)}/1`,'--accent'],
  ['pz1','積木學徒','完成第一題字根積木',()=>st.counters.puzzles>=1,()=>`${Math.min(st.counters.puzzles,1)}/1`,'--root'],
  ['pz10','積木大師','完成 10 題字根積木',()=>st.counters.puzzles>=10,()=>`${Math.min(st.counters.puzzles,10)}/10`,'--root'],
  ['myth','神話獵人','讀過一則神話或歷史字源故事（試試 panic 或 bankrupt）',()=>st.counters.myth>=1,()=>`${st.counters.myth?1:0}/1`,'--suf'],
  ['streak','七日不斷','連續 7 天完成複習',()=>streak()>=7,()=>`${Math.min(streak(),7)}/7`,'--good'],
  ['coll','字根收藏家','學會 30 個字首或字根',()=>DECK.filter(isLearned).length>=30,()=>`${Math.min(DECK.filter(isLearned).length,30)}/30`,'--gold'],
  ['time','時間旅人','學會「時間與順序」區的全部字根',()=>catP('time').p===1,()=>{const c=catP('time');return `${c.l}/${c.t}`;},'--accent']
];
function catP(cat){ const ids=DECK.filter(id=>M[id].cat===cat); const l=ids.filter(isLearned).length; return {t:ids.length,l,p:ids.length?l/ids.length:0,ids}; }
function medal(col){ return `<svg class="medal" viewBox="0 0 48 48" aria-hidden="true"><path d="M16 4h6l4 12h-6zM32 4h-6l-4 12h6z" fill="var(${col})" opacity=".55"/><circle cx="24" cy="29" r="14" fill="color-mix(in srgb,var(${col}) 18%,var(--surface))" stroke="var(${col})" stroke-width="2.5"/><path d="M24 21.5l2.3 4.7 5.2.7-3.8 3.6.9 5.1-4.6-2.4-4.6 2.4.9-5.1-3.8-3.6 5.2-.7z" fill="var(${col})"/></svg>`; }
function renderBadges(){
  const regions=Object.keys(CATS).filter(c=>c!=='suf').map(cat=>{
    const c=catP(cat); const tier=c.p>=1?'gold':c.p>=.6?'silver':c.p>=.3?'bronze':'none';
    const tn={gold:'金牌',silver:'銀牌',bronze:'銅牌',none:'尚未解鎖'}[tier];
    const col=tier==='none'?'var(--muted)':`var(--${tier})`;
    const C=2*Math.PI*26;
    const next=c.ids.filter(id=>!isLearned(id)).slice(0,4).map(id=>M[id].label).join(' · ');
    return `<div class="panel region"><svg class="ring" viewBox="0 0 64 64" role="img" aria-label="${CATS[cat]} ${Math.round(c.p*100)}%"><circle class="bg" cx="32" cy="32" r="26"/><circle class="fg" cx="32" cy="32" r="26" stroke="${col}" stroke-dasharray="${(C*c.p).toFixed(1)} ${C.toFixed(1)}"/><text x="32" y="37">${Math.round(c.p*100)}%</text></svg>
      <div style="min-width:0"><h3>${CATS[cat]}</h3><span class="tier ${tier}">${tn}</span> <span class="k">${c.l}/${c.t}</span><div class="mini-r">${next?'下一批：'+esc(next):'這一區全部學會了'}</div></div></div>`;
  }).join('');
  const achs=ACH.map(([id,name,desc,ok,prog,col])=>{const u=ok(); return `<div class="panel ach${u?'':' locked'}">${medal(col)}<div style="min-width:0"><h4>${name}</h4><p>${desc}</p><span class="st">${u?'已解鎖':prog()}</span></div></div>`;}).join('');
  $('#bdg').innerHTML=`<div class="regions">${regions}</div><h2 class="sec-h">成就勳章</h2><div class="achs">${achs}</div>`;
}

/* ======================= routing & events ======================= */
const VIEWS={explore:['字根地圖','點選字根，看它長出哪些單字；點單字看積木拆解。'],split:['拆解實驗室','把任何英文單字切成字首、字根、字尾。'],review:['今日複習','間隔重複：答得越熟，下次出現得越晚。'],puzzle:['字根積木','把積木拼成符合中文字義的單字。'],badges:['解鎖地圖','每一區學會的字根越多，勳章等級越高。']};
function renderDemoPill(){
  $('#demoPill').innerHTML=st.demo?`<span class="pill">目前顯示示範進度<button data-act="reset">${ui.confirmReset?'確定清除？':'從零開始'}</button></span>`:'';
}
function show(view){
  if(!VIEWS[view]) view='explore';
  ui.view=view;
  Object.keys(VIEWS).forEach(v=>{ $('#v-'+v).hidden=v!==view; });
  document.querySelectorAll('[data-nav]').forEach(a=>{ if(a.dataset.nav===view) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  $('#vTitle').textContent=VIEWS[view][0]; $('#vSub').textContent=VIEWS[view][1];
  renderDemoPill();
  if(view==='explore') renderExplore();
  if(view==='split'&&!$('#spOut').innerHTML){ $('#spInput').value='progressive'; renderSplit('progressive',false); }
  if(view==='review') renderReview();
  if(view==='puzzle') renderPuzzle();
  if(view==='badges') renderBadges();
}
function renderLevel(){ document.querySelectorAll('[data-level]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.level===maxLevel)); }
function setLevel(lv){
  maxLevel=lv; try{ localStorage.setItem('wb-level',String(lv)); }catch(e){}
  rebuildDeck(); renderLevel(); rv=null; pz=null; show(ui.view);
}
function route(){ show((location.hash||'#explore').slice(1)); }
function go(view){ if(location.hash!=='#'+view) location.hash=view; else show(view); }

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-center],[data-word],[data-tab],[data-act],[data-speak],[data-tk],[data-split],[data-level]');
  if(!t){ const pop=$('#extPop'); if(pop&&!pop.hidden&&!e.target.closest('#extPop')) pop.hidden=true; if(sync.open&&!e.target.closest('#acctWrap')){ sync.open=false; renderAccount(); } return; }
  if(t.dataset.level){ setLevel(+t.dataset.level); return; }
  if(t.dataset.speak){ speak(t.dataset.speak); return; }
  if(t.dataset.tk){ showPop(t); return; }
  if(t.dataset.split){ $('#spInput').value=t.dataset.split; renderSplit(t.dataset.split); return; }
  if(t.dataset.center){
    const id=t.dataset.center; ui.center=id;
    if(M[id].type!==ui.tab) ui.tab=M[id].type;
    const ws=shown(id); ui.word=(ui.word&&ws.some(w=>w.w===ui.word))?ui.word:(ws[0]?ws[0].w:null);
    if(ui.view!=='explore') go('explore'); else renderExplore();
    if(matchMedia('(max-width:820px)').matches) $('.mapwrap').scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});
    return;
  }
  if(t.dataset.word){
    ui.word=t.dataset.word;
    if(!W[ui.word].parts.some(p=>p.id===ui.center)){ const r=W[ui.word].parts.find(p=>M[p.id].type==='root'); if(r) ui.center=r.id; renderList(); renderMap(); }
    else document.querySelectorAll('#map .nd').forEach(n=>n.classList.toggle('sel',n.dataset.word===ui.word));
    renderDetail();
    if(matchMedia('(max-width:820px)').matches) $('#detail').scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});
    return;
  }
  if(t.dataset.tab){ ui.tab=t.dataset.tab; renderList(); return; }
  const act=t.dataset.act;
  if(act==='reveal'&&rv.q){ rv.q.revealed=true; renderReview(); }
  if(act==='choose'&&rv.q&&!rv.q.revealed){ const i=+t.dataset.i; rv.q.picked=i; rv.q.ok=rv.q.opts[i]===rv.q.target; rv.q.revealed=true; renderReview(); }
  if(act==='grade') grade(+t.dataset.g);
  if(act==='morenew') startSession(5);
  if(act==='place'&&pz.state!=='win'){ const i=+t.dataset.i; if(!pz.placed.includes(i)){ pz.placed.push(i); pz.state=null; renderPuzzle(); } }
  if(act==='unplace'&&pz.state!=='win'){ pz.placed.splice(+t.dataset.k,1); pz.state=null; renderPuzzle(); }
  if(act==='pzclear'){ pz.placed=[]; pz.state=null; renderPuzzle(); }
  if(act==='pzhint'){ pz.showHint=true; renderPuzzle(); }
  if(act==='pzcheck') pzCheck();
  if(act==='pznext') newPuzzle();
  if(act==='popclose') $('#extPop').hidden=true;
  if(act==='acct'){ sync.open=!sync.open; renderAccount(); if(sync.open&&!sync.user) setTimeout(()=>$('#acctEmail')?.focus(),0); return; }
  if(act==='syncnow'){ syncNow(); return; }
  if(act==='signout'){ sync.client.auth.signOut(); sync.open=false; renderAccount(); return; }
  if(act==='signup'){ sync.email=$('#acctEmail').value; authAction('signup'); return; }
  if(act==='reset'){
    if(!ui.confirmReset){ ui.confirmReset=true; renderDemoPill(); setTimeout(()=>{ui.confirmReset=false;renderDemoPill();},4000); return; }
    ui.confirmReset=false; st=freshState(); save(); rv=null; show(ui.view);
  }
});
document.addEventListener('keydown',e=>{
  const nd=e.target.closest&&e.target.closest('#map .nd'); if(nd&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); nd.dispatchEvent(new MouseEvent('click',{bubbles:true})); return; }
  if(ui.view!=='review'||!rv||!rv.q) return;
  if(e.target.tagName==='INPUT') return;
  if(e.key===' '&&!rv.q.revealed&&rv.q.mode==='meaning'){ e.preventDefault(); rv.q.revealed=true; renderReview(); }
  else if(rv.q.revealed&&['1','2','3','4'].includes(e.key)) grade(+e.key-1);
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='spForm'){ renderSplit($('#spInput').value); return; }
  if(e.target.id==='acctForm'){ sync.email=$('#acctEmail').value; authAction('signin'); return; }
  if(e.target.dataset.form==='spell'&&rv.q&&!rv.q.revealed){ const v=$('#spellIn').value.trim().toLowerCase(); if(!v) return; rv.q.typed=v; rv.q.ok=v===rv.q.target.w; rv.q.revealed=true; renderReview(); }
});
$('#exSearch').addEventListener('input',e=>{ ui.q=e.target.value; renderList(); });
// drag & drop for puzzle (desktop); tapping works everywhere
document.addEventListener('dragstart',e=>{ const b=e.target.closest&&e.target.closest('#bank .blk'); if(b){ e.dataTransfer.setData('text/plain',b.dataset.i); e.dataTransfer.effectAllowed='move'; } });
document.addEventListener('dragover',e=>{ const s=e.target.closest&&e.target.closest('#slot'); if(s){ e.preventDefault(); s.classList.add('over'); } });
document.addEventListener('dragleave',e=>{ const s=e.target.closest&&e.target.closest('#slot'); if(s&&!s.contains(e.relatedTarget)) s.classList.remove('over'); });
document.addEventListener('drop',e=>{ const s=e.target.closest&&e.target.closest('#slot'); if(!s) return; e.preventDefault(); const i=+e.dataTransfer.getData('text/plain'); if(!Number.isNaN(i)&&!pz.placed.includes(i)&&pz.state!=='win'){ pz.placed.push(i); pz.state=null; } renderPuzzle(); });

$('#spEx').innerHTML=['progressive','incredible','unpredictable','bankrupt','panic','construction','inspector','transportation'].map(w=>`<button class="chip" data-split="${w}">${w}</button>`).join('');
renderExt(); renderWidget(); renderLevel(); syncStart();
window.addEventListener('hashchange',route);
route();
</script>
