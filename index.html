<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>字根工坊</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: desktop = labelled nav rail + workspace (explore is list | radial map | detail); tablet = icon rail; phone = single column of cards + bottom tab bar */
:root{
  --bg:#edf1f0; --surface:#ffffff; --sunk:#e2e8e6; --ink:#17201e; --muted:#566562; --line:#d2dbd8;
  --accent:#0d6a61; --accent-ink:#ffffff;
  --pre:#2a68c9; --root:#bf5a14; --suf:#7647c9; --link:#7d8b88;
  --good:#2b8548; --bad:#c03636; --gold:#b07a12; --silver:#7b8a93; --bronze:#a2603a;
  --display:"LXGW WenKai TC","Noto Serif TC","Songti TC",serif;
  --latin:"Bitter",Georgia,"Times New Roman",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1514; --surface:#171f1e; --sunk:#0b100f; --ink:#e3eae8; --muted:#94a4a0; --line:#28332f;
    --accent:#3db3a4; --accent-ink:#04201c;
    --pre:#7ba9f6; --root:#f29a56; --suf:#b597f6; --link:#7f8e8a;
    --good:#5cc47f; --bad:#f07171; --gold:#e2b44c; --silver:#a9b6bd; --bronze:#d08a5f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#171f1e; --sunk:#0b100f; --ink:#e3eae8; --muted:#94a4a0; --line:#28332f;
  --accent:#3db3a4; --accent-ink:#04201c;
  --pre:#7ba9f6; --root:#f29a56; --suf:#b597f6; --link:#7f8e8a;
  --good:#5cc47f; --bad:#f07171; --gold:#e2b44c; --silver:#a9b6bd; --bronze:#d08a5f;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.latin{font-family:var(--latin)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;display:flex;flex-direction:column;gap:6px;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:22px;font-weight:700;position:relative}
.logo::before{content:"";position:absolute;top:-5px;left:7px;right:7px;height:5px;background:radial-gradient(circle at 50% 100%,var(--accent) 0 4px,transparent 4.5px) 0 0/12px 5px repeat-x}
.bname{font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a[aria-current="page"]{background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent)}
.rail .widget{margin-top:auto}
.main{min-width:0;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.main>*{max-width:1320px;margin-inline:auto}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:20px}
.top h1{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:.02em}
.top p{color:var(--muted);margin-top:2px}
.top-r{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.legend{display:flex;gap:12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 6px 5px 12px;border-radius:999px;background:color-mix(in srgb,var(--gold) 15%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);color:var(--ink)}
.pill button{border:0;background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--ink)}
.view[hidden]{display:none}

/* ---------- generic ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h2{font-family:var(--display);font-size:20px;font-weight:700;margin-bottom:4px}
.sub{color:var(--muted);font-size:13.5px}
.k{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 10px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-family:var(--latin);font-size:14px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
input[type="text"],input[type="search"]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 12px;min-width:0}
input[type="text"]:focus,input[type="search"]:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface)}

/* ---------- lego blocks ---------- */
.lego{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding-top:8px;transition:gap .5s cubic-bezier(.2,.8,.2,1)}
.lego.joined{gap:0}
.lego.joined .blk{transform:translateY(4px)}
.blk{--c:var(--root);position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:62px;padding:10px 14px 9px;border:2px solid var(--c);border-radius:6px;background:color-mix(in srgb,var(--c) 12%,var(--surface));text-align:center;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.blk::before{content:"";position:absolute;top:-8px;left:10px;right:10px;height:6px;background:radial-gradient(circle at 50% 100%,var(--c) 0 5px,transparent 5.5px) 50% 0/20px 6px repeat-x}
button.blk:hover{transform:translateY(-3px);box-shadow:0 6px 0 -2px color-mix(in srgb,var(--c) 35%,transparent)}
.blk .bk{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--c);font-weight:600}
.blk .bt{font-family:var(--latin);font-weight:700;font-size:26px;line-height:1.15;color:var(--c)}
.blk .bm{font-size:12.5px;color:var(--ink)}
.blk.mini{min-width:0;padding:6px 9px 5px}
.blk.mini .bt{font-size:17px}
.blk.mini .bk{display:none}
.blk.mini::before{top:-6px;height:5px;background-size:14px 5px;background-image:radial-gradient(circle at 50% 100%,var(--c) 0 3.5px,transparent 4px)}
.t-pre{color:var(--pre);fill:var(--pre)} .t-root{color:var(--root);fill:var(--root)} .t-suf{color:var(--suf);fill:var(--suf)} .t-link{color:var(--link);fill:var(--link)}

/* ---------- explore ---------- */
.ex-grid{display:grid;grid-template-columns:240px minmax(0,1fr) 350px;gap:16px;align-items:start}
.ex-list{position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;gap:12px;padding:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:9px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 0;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.mlist{overflow-y:auto;display:flex;flex-direction:column;gap:14px;margin-inline:-6px;padding-inline:6px}
.lg-h{font-size:12px;color:var(--muted);margin-bottom:4px;letter-spacing:.04em}
.lg-items{display:flex;flex-direction:column;gap:2px}
.li{--c:var(--root);display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:8px;width:100%;border:0;background:transparent;text-align:left;border-radius:8px;padding:6px 8px}
.li:hover{background:var(--sunk)}
.li.on{background:color-mix(in srgb,var(--c) 13%,var(--surface))}
.li-f{font-family:var(--latin);font-weight:700;color:var(--c);white-space:nowrap}
.li-m{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.li .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-left:4px;vertical-align:middle}
.empty{color:var(--muted);font-size:13.5px;padding:8px}
.mapwrap{padding:10px;position:relative}
.maphead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 8px 0}
.map{display:block;width:100%;height:auto;max-width:100%}
.map .ln{stroke:var(--line);stroke-width:1.5}
.map .ctr circle{fill:color-mix(in srgb,var(--cc) 14%,var(--surface));stroke:var(--cc);stroke-width:2.5}
.map .ctr{cursor:pointer}
.map .cf{font-family:var(--latin);font-weight:700;font-size:25px;fill:var(--cc);text-anchor:middle}
.map .cm{font-family:var(--body);font-size:13px;fill:var(--ink);text-anchor:middle}
.map .ck{font-family:var(--mono);font-size:10px;fill:var(--muted);text-anchor:middle;letter-spacing:.1em}
.map .nd{cursor:pointer;transform:translate(var(--x),var(--y));transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .4s}
.map.boot .nd{transform:translate(320px,220px);opacity:0}
.map .nd rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.map .nd:hover rect{stroke:var(--muted)}
.map .nd.sel rect{stroke:var(--accent);stroke-width:2.5;fill:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.map .nd:focus{outline:none}
.map .nd:focus-visible rect{stroke:var(--accent);stroke-width:3}
.map .nw{font-family:var(--latin);font-weight:600;font-size:16px;text-anchor:middle}
.map .nw .hit{font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.map .nz{font-family:var(--body);font-size:11.5px;fill:var(--muted);text-anchor:middle}
.map .more{font-size:12px;fill:var(--muted);text-anchor:middle}
.detail{display:flex;flex-direction:column;gap:16px}
.wc-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wc-w{font-family:var(--latin);font-weight:700;font-size:30px;line-height:1.2;overflow-wrap:anywhere}
.lit{margin-top:14px;font-size:14.5px}
.lit b{font-weight:700}
.ex{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--sunk);font-family:var(--latin);font-size:14.5px;line-height:1.5}
.ex mark{background:transparent;color:var(--accent);font-weight:700}
.mc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tchip{--c:var(--root);font-size:12px;font-weight:700;padding:2px 9px;border-radius:5px;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--c)}
.mc-f{font-family:var(--latin);font-weight:700;font-size:28px;color:var(--c);line-height:1.25;margin-top:6px;overflow-wrap:anywhere}
.mc-m{font-size:17px;font-weight:500}
.mc-o{font-size:13px;color:var(--muted);margin-top:2px}
.story{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-family:var(--display);font-size:16px;line-height:1.75}
.scene{margin-top:12px;display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:10px;border:1.5px dashed var(--line);border-radius:10px;font-size:13.5px}
.scene svg{width:52px;height:52px}
.wl{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px}
.widget-inline{display:none;margin-bottom:16px}

/* widget */
.wg{--c:var(--root);position:relative;border-radius:16px;padding:14px 16px;background:color-mix(in srgb,var(--c) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,transparent);display:grid;gap:2px}
.wg-k{font-size:11.5px;color:var(--muted)}
.wg-f{font-family:var(--latin);font-weight:700;font-size:28px;color:var(--c);line-height:1.2}
.wg-m{font-family:var(--display);font-size:17px}
.wg-w{font-family:var(--latin);font-size:13px;color:var(--muted)}
.wg button{justify-self:start;margin-top:6px}

/* ---------- split ---------- */
.sp-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.sp-form{display:flex;gap:8px;margin-top:14px}
.sp-form input{font-family:var(--latin);font-size:17px}
.sp-ex{margin-top:12px}
.sp-out{margin-top:22px;min-height:180px}
.so-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px}
.so-w{font-family:var(--latin);font-weight:700;font-size:34px;overflow-wrap:anywhere}
.src{font-size:12px;padding:2px 8px;border-radius:5px;font-weight:500}
.src.db{background:color-mix(in srgb,var(--good) 15%,var(--surface));color:var(--good)}
.src.auto{background:color-mix(in srgb,var(--gold) 16%,var(--surface));color:var(--gold)}
.note{margin-top:12px;font-size:13px;color:var(--muted)}
.browser{margin-top:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.bbar{border-radius:10px 10px 0 0;display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--sunk)}
.dots{display:flex;gap:5px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.url{flex:1;min-width:0;font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--surface);border-radius:6px;padding:3px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.extico{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:13px;font-weight:700}
.bpage{position:relative;padding:18px 18px 22px;background:var(--surface);border-radius:0 0 10px 10px}
.bpage h3{font-family:var(--latin);font-size:19px;line-height:1.35;margin-bottom:10px}
.bpage p{font-family:var(--latin);font-size:15px;line-height:1.75}
.tk{cursor:pointer;border-radius:3px}
.tk:hover{background:color-mix(in srgb,var(--accent) 15%,transparent)}
.tk.on{background:color-mix(in srgb,var(--accent) 28%,transparent)}
.pop{position:absolute;z-index:5;width:min(300px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px 12px 10px}
.pop-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pop-w{font-family:var(--latin);font-weight:700;font-size:18px}
.pop .lego{gap:6px;margin-top:8px}
.pop-z{margin-top:8px;font-size:13.5px}
.pop-a{margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}

/* ---------- review ---------- */
.rv-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.stats{display:grid;gap:14px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat b{display:block;font-family:var(--latin);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.fc{display:block;width:100%;height:auto}
.fc .bar{fill:var(--accent)} .fc .bar0{fill:var(--root)}
.fc text{font-family:var(--mono);font-size:10px;fill:var(--muted);text-anchor:middle}
.fc .gl{stroke:var(--line);stroke-width:1}
.card{min-height:380px;display:flex;flex-direction:column}
.cq{color:var(--muted);font-size:14px}
.cq b{color:var(--ink)}
.cbig{font-family:var(--latin);font-weight:700;font-size:56px;line-height:1.1;margin:18px 0 6px;color:var(--c);overflow-wrap:anywhere}
.czh{font-family:var(--display);font-size:34px;margin:18px 0 6px}
.cwords{font-family:var(--latin);font-size:16px;color:var(--muted)}
.cwords b{color:var(--c)}
.cans{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.cans .mean{font-family:var(--display);font-size:26px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;font-family:var(--latin);font-size:18px;font-weight:600;text-align:center}
.opt:hover{border-color:var(--muted)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.spell{display:flex;gap:8px;margin-top:18px}
.spell input{font-family:var(--latin);font-size:20px}
.verdict{margin-top:12px;font-weight:700}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.cfoot{margin-top:auto;padding-top:20px}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.g{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;display:grid;gap:0;text-align:center}
.g b{font-size:14.5px}
.g span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.g:hover{border-color:var(--gc)}
.g.sugg{border-color:var(--gc);background:color-mix(in srgb,var(--gc) 10%,var(--surface))}
.kbd{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:10px;text-align:center}
.done{display:grid;place-items:center;text-align:center;gap:10px;flex:1}
.done h3{font-family:var(--display);font-size:26px}

/* ---------- puzzle ---------- */
.pz{max-width:820px;margin-inline:auto}
.pz-t{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.pz-zh{font-family:var(--display);font-size:40px;line-height:1.2;margin-top:4px}
.pz-hint{margin-top:6px;color:var(--muted);font-size:14px;min-height:1.6em}
.slot{margin-top:18px;min-height:112px;border:2px dashed var(--line);border-radius:12px;padding:18px 14px 12px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:0;background:var(--bg);transition:border-color .2s,background .2s}
.slot.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--bg))}
.slot.win{border-style:solid;border-color:var(--good);background:color-mix(in srgb,var(--good) 8%,var(--bg))}
.slot.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.slot .ph{color:var(--muted);font-size:13.5px;align-self:center;width:100%;text-align:center}
.bank{margin-top:22px;display:flex;flex-wrap:wrap;gap:16px 12px;padding-top:6px}
.bank .blk{cursor:grab}
.bank .blk.used{opacity:.25;pointer-events:none}
.pz-msg{margin-top:14px;min-height:1.6em;font-weight:500}
.pz-msg.ok{color:var(--good)} .pz-msg.no{color:var(--bad)}
.pz-act{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}

/* ---------- badges ---------- */
.regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}

/* ======================= split ======================= */
function autoSeg(s){
  const n=s.length, PH={pre:0,root:1,suf:2}, best=new Map(), key=(i,p,r)=>i+'|'+p+'|'+r;
  best.set(key(0,0,0),{c:0,back:null});
  for(let i=0;i<n;i++) for(let p=0;p<3;p++) for(let r=0;r<2;r++){
    const cur=best.get(key(i,p,r)); if(!cur) continue;
    const relax=(j,np,nr,cost,seg)=>{const k=key(j,np,nr),c=cur.c+cost,o=best.get(k); if(!o||c<o.c) best.set(k,{c,back:{k:key(i,p,r),seg}});};
    for(const f of FORMS){
      if(!s.startsWith(f.t,i)) continue;
      const fp=PH[f.type]; if(fp<p) continue; if(f.type==='suf'&&!r) continue;
      relax(i+f.t.length,fp,(r||f.type==='root')?1:0,1+(f.t.length<=2?.9:0)+(f.t.length===1?1:0),{id:f.id,t:f.t});
    }
    relax(i+1,p,r,'aeiou'.includes(s[i])?1.4:2.6,{id:null,t:s[i]});
  }
  let end=null; for(let p=0;p<3;p++){const o=best.get(key(n,p,1)); if(o&&(!end||o.c<end.c)) end=o;}
  if(!end) return null;
  const segs=[]; let node=end; while(node&&node.back){segs.unshift(node.back.seg); node=best.get(node.back.k);}
  const out=[]; segs.forEach(g=>{ const l=out[out.length-1]; if(!g.id&&l&&!l.id) l.t+=g.t; else out.push({...g}); });
  const unk=out.filter(g=>!g.id).reduce((a,g)=>a+g.t.length,0);
  return unk/n>.45?null:out;
}
function analyze(raw){
  const s=String(raw).toLowerCase().replace(/[^a-z]/g,''); if(!s) return null;
  if(W[s]) return {...W[s],source:'db'};
  for(const [a,b] of [['ies','y'],['ied','y'],['ing','e'],['ing',''],['ed','e'],['ed',''],['d',''],['es',''],['s','']]){
    if(s.endsWith(a)){ const base=s.slice(0,-a.length)+b; if(W[base]) return {...W[base],source:'db',from:s}; }
  }
  const seg=autoSeg(s);
  if(seg) return {w:s,parts:seg,source:'auto',lit:seg.map(p=>p.id?short(M[p.id].mean):'（連接）').join(' + ')};
  return {w:s,source:'none'};
}

const NEW_LIMIT=8;

function buildQueue(extraNew=0){
  const now=Date.now();
  const due=DECK.filter(id=>st.cards[id]&&st.cards[id].due<=now).sort((a,b)=>st.cards[a].due-st.cards[b].due);
  const room=Math.max(0,NEW_LIMIT-st.newDay.n)+extraNew;
  const fresh=DECK.filter(id=>!st.cards[id]).sort((a,b)=>(M[b].type==='root')-(M[a].type==='root')).slice(0,room);
  return [...due,...fresh];
}
function initSession(extraNew=0){ rv={queue:buildQueue(extraNew),done:0,q:null}; rv.q=rv.queue.length?makeQ(rv.queue[0]):null; }
function startSession(extraNew=0){ initSession(extraNew); renderReview(); }
function nextCard(){ rv.q=rv.queue.length?makeQ(rv.queue[0]):null; renderReview(); }
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function makeQ(id){
  const c=st.cards[id], ws=wordsWith(id), m=M[id];
  let mode=(!c||c.reps===0)?'meaning':pick(['meaning','choose','spell']);
  const toks=x=>x.mean.split(/[、；（）]/).filter(Boolean);
  const mine=toks(m); const similar=new Set(Object.values(M).filter(x=>toks(x).some(t=>mine.includes(t))).map(x=>x.id));
  const others=WORDS.filter(w=>!w.parts.some(p=>similar.has(p.id)));
  if(mode==='choose'&&others.length<3) mode='meaning';
  const q={id,mode,revealed:false,ok:null};
  if(mode==='meaning') q.examples=shuffle(ws).slice(0,2);
  if(mode==='choose'){ q.target=pick(ws); q.opts=shuffle([q.target,...shuffle(others).slice(0,3)]); }
  if(mode==='spell'){ const neg=ws.filter(w=>w.parts.some(p=>['inneg','un','dis','anti','contra'].includes(p.id))&&w.parts[0].id!==id); q.neg=neg.length>0; q.target=pick(neg.length?neg:ws); }
  return q;
}
function nextState(c,g){
  c=c?{...c}:{ease:2.5,ivl:0,reps:0,lapses:0}; const now=Date.now();
  if(g===0){ c.reps=0; c.lapses++; c.ease=Math.max(1.3,c.ease-.2); c.ivl=0; c.due=now+6e4; }
  else if(g===1){ if(c.reps===0){c.ivl=0;c.due=now+6e5;} else {c.ivl=Math.max(1,Math.round(c.ivl*1.2));c.due=now+c.ivl*DAY;} c.ease=Math.max(1.3,c.ease-.15); c.reps++; }
  else if(g===2){ c.ivl=c.reps===0?1:c.reps===1?3:Math.round(Math.max(c.ivl,1)*c.ease); c.due=now+c.ivl*DAY; c.reps++; }
  else { c.ivl=c.reps===0?4:Math.round(Math.max(c.ivl,1)*c.ease*1.3); c.ease+=.15; c.due=now+c.ivl*DAY; c.reps++; }
  c.last=g; return c;
}
function fmtDur(ms){ const m=Math.round(ms/6e4); if(m<60) return `${Math.max(1,m)} 分`; const h=Math.round(m/60); if(h<24) return `${h} 小時`; const d=Math.round(ms/DAY); if(d<31) return `${d} 天`; return `${(d/30).toFixed(d<300?1:0)} 個月`; }

  } else {

}

/* ======================= routing & events ======================= */
const VIEWS={explore:['字根地圖','點選字根，看它長出哪些單字；點單字看積木拆解。'],split:['拆解實驗室','把任何英文單字切成字首、字根、字尾。'],review:['今日複習','間隔重複：答得越熟，下次出現得越晚。'],puzzle:['字根積木','把積木拼成符合中文字義的單字。'],badges:['解鎖地圖','每一區學會的字根越多，勳章等級越高。']};
function renderDemoPill(){
  $('#demoPill').innerHTML=st.demo?`<span class="pill">目前顯示示範進度<button data-act="reset">${ui.confirmReset?'確定清除？':'從零開始'}</button></span>`:'';
}
function show(view){
  if(!VIEWS[view]) view='explore';
  ui.view=view;
  Object.keys(VIEWS).forEach(v=>{ $('#v-'+v).hidden=v!==view; });
  document.querySelectorAll('[data-nav]').forEach(a=>{ if(a.dataset.nav===view) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  $('#vTitle').textContent=VIEWS[view][0]; $('#vSub').textContent=VIEWS[view][1];
  renderDemoPill();
  if(view==='explore') renderExplore();
  if(view==='split'&&!$('#spOut').innerHTML){ $('#spInput').value='progressive'; renderSplit('progressive',false); }
  if(view==='review') renderReview();
  if(view==='puzzle') renderPuzzle();
  if(view==='badges') renderBadges();
}
function route(){ show((location.hash||'#explore').slice(1)); }
function go(view){ if(location.hash!=='#'+view) location.hash=view; else show(view); }

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-center],[data-word],[data-tab],[data-act],[data-speak],[data-tk],[data-split]');
  if(!t){ const pop=$('#extPop'); if(pop&&!pop.hidden&&!e.target.closest('#extPop')) pop.hidden=true; return; }
  if(t.dataset.speak){ speak(t.dataset.speak); return; }
  if(t.dataset.tk){ showPop(t); return; }
  if(t.dataset.split){ $('#spInput').value=t.dataset.split; renderSplit(t.dataset.split); return; }
  if(t.dataset.center){
    const id=t.dataset.center; ui.center=id;
    if(M[id].type!==ui.tab) ui.tab=M[id].type;
    const ws=wordsWith(id); ui.word=(ui.word&&ws.some(w=>w.w===ui.word))?ui.word:(ws[0]?ws[0].w:null);
    if(ui.view!=='explore') go('explore'); else renderExplore();
    if(matchMedia('(max-width:820px)').matches) $('.mapwrap').scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});
    return;
  }
  if(t.dataset.word){
    ui.word=t.dataset.word;
    if(!W[ui.word].parts.some(p=>p.id===ui.center)){ const r=W[ui.word].parts.find(p=>M[p.id].type==='root'); if(r) ui.center=r.id; renderList(); renderMap(); }
    else document.querySelectorAll('#map .nd').forEach(n=>n.classList.toggle('sel',n.dataset.word===ui.word));
    renderDetail();
    if(matchMedia('(max-width:820px)').matches) $('#detail').scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});
    return;
  }
  if(t.dataset.tab){ ui.tab=t.dataset.tab; renderList(); return; }
  const act=t.dataset.act;
  if(act==='reveal'&&rv.q){ rv.q.revealed=true; renderReview(); }
  if(act==='choose'&&rv.q&&!rv.q.revealed){ const i=+t.dataset.i; rv.q.picked=i; rv.q.ok=rv.q.opts[i]===rv.q.target; rv.q.revealed=true; renderReview(); }
  if(act==='grade') grade(+t.dataset.g);
  if(act==='morenew') startSession(5);
  if(act==='place'&&pz.state!=='win'){ const i=+t.dataset.i; if(!pz.placed.includes(i)){ pz.placed.push(i); pz.state=null; renderPuzzle(); } }
  if(act==='unplace'&&pz.state!=='win'){ pz.placed.splice(+t.dataset.k,1); pz.state=null; renderPuzzle(); }
  if(act==='pzclear'){ pz.placed=[]; pz.state=null; renderPuzzle(); }
  if(act==='pzhint'){ pz.showHint=true; renderPuzzle(); }
  if(act==='pzcheck') pzCheck();
  if(act==='pznext') newPuzzle();
  if(act==='popclose') $('#extPop').hidden=true;
  if(act==='reset'){
    if(!ui.confirmReset){ ui.confirmReset=true; renderDemoPill(); setTimeout(()=>{ui.confirmReset=false;renderDemoPill();},4000); return; }
    ui.confirmReset=false; st=freshState(); save(); rv=null; show(ui.view);
  }
});
document.addEventListener('keydown',e=>{
  const nd=e.target.closest&&e.target.closest('#map .nd'); if(nd&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); nd.dispatchEvent(new MouseEvent('click',{bubbles:true})); return; }
  if(ui.view!=='review'||!rv||!rv.q) return;
  if(e.target.tagName==='INPUT') return;
  if(e.key===' '&&!rv.q.revealed&&rv.q.mode==='meaning'){ e.preventDefault(); rv.q.revealed=true; renderReview(); }
  else if(rv.q.revealed&&['1','2','3','4'].includes(e.key)) grade(+e.key-1);
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='spForm'){ renderSplit($('#spInput').value); return; }
  if(e.target.dataset.form==='spell'&&rv.q&&!rv.q.revealed){ const v=$('#spellIn').value.trim().toLowerCase(); if(!v) return; rv.q.typed=v; rv.q.ok=v===rv.q.target.w; rv.q.revealed=true; renderReview(); }
});
$('#exSearch').addEventListener('input',e=>{ ui.q=e.target.value; renderList(); });
// drag & drop for puzzle (desktop); tapping works everywhere
document.addEventListener('dragstart',e=>{ const b=e.target.closest&&e.target.closest('#bank .blk'); if(b){ e.dataTransfer.setData('text/plain',b.dataset.i); e.dataTransfer.effectAllowed='move'; } });
document.addEventListener('dragover',e=>{ const s=e.target.closest&&e.target.closest('#slot'); if(s){ e.preventDefault(); s.classList.add('over'); } });
document.addEventListener('dragleave',e=>{ const s=e.target.closest&&e.target.closest('#slot'); if(s&&!s.contains(e.relatedTarget)) s.classList.remove('over'); });
document.addEventListener('drop',e=>{ const s=e.target.closest&&e.target.closest('#slot'); if(!s) return; e.preventDefault(); const i=+e.dataTransfer.getData('text/plain'); if(!Number.isNaN(i)&&!pz.placed.includes(i)&&pz.state!=='win'){ pz.placed.push(i); pz.state=null; } renderPuzzle(); });

$('#spEx').innerHTML=['progressive','incredible','unpredictable','bankrupt','panic','construction','inspector','transportation'].map(w=>`<button class="chip" data-split="${w}">${w}</button>`).join('');
renderExt(); renderWidget();
window.addEventListener('hashchange',route);
route();
</script>

</body>
