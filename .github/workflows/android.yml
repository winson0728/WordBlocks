name: Android app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # data/wordblocks.json, index.html and the Flutter asset must match data/*.txt
      - name: Check generated data is up to date
        run: node tools/build-data.mjs --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Analyze and test
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build APK
        working-directory: flutter_app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: wordblocks-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
